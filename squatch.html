<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Squatch</title>
<link rel="icon" type="image/png" href="squatch-icon.png">
<link rel="apple-touch-icon" href="squatch-icon.png">
<link rel="manifest" href="squatch.webmanifest">
<style>
  @font-face { font-family:"Heraldic"; src:url("fonts/HeraldicShadows.otf") format("opentype"); font-display:swap; }
  @font-face { font-family:"Nightshade"; src:url("fonts/JimNightshade.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Shoulders"; src:url("fonts/BigShoulders.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Typewriter"; src:url("fonts/KingthingsTrypewriter2.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Courier Prime"; src:url("fonts/CourierPrime-Regular.ttf") format("truetype"); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:"Courier Prime"; src:url("fonts/CourierPrime-Bold.ttf") format("truetype"); font-weight:700; font-style:normal; font-display:swap; }
  @font-face { font-family:"Courier Prime"; src:url("fonts/CourierPrime-Italic.ttf") format("truetype"); font-weight:400; font-style:italic; font-display:swap; }
  @font-face { font-family:"Courier Prime"; src:url("fonts/CourierPrime-BoldItalic.ttf") format("truetype"); font-weight:700; font-style:italic; font-display:swap; }
  /* typewriter faces — Wripetyter carries the titles, 1942 the accents (Adler & Harting kept as alternates in the Titles cycle) */
  @font-face { font-family:"Wripetyter"; src:url("fonts/Wripetyter.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"F1942"; src:url("fonts/1942.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Adler"; src:url("fonts/Adler.ttf") format("truetype"); font-display:swap; }
  @font-face { font-family:"Harting"; src:url("fonts/HartingPlain.ttf") format("truetype"); font-display:swap; }
  /* the pixel faces — 2026-09-14, his word: titles and menus wear Joystix (arcade caps), chapters
     and scene lines wear Pixelta (a pixel serif with a lowercase). The script body stays Courier Prime. */
  @font-face { font-family:"Joystix"; src:url("fonts/joystix.otf") format("opentype"); font-display:block; }
  @font-face { font-family:"Pixelta"; src:url("fonts/pixelta.ttf") format("truetype"); font-display:block; }
  @font-face { font-family:"AqBold"; src:url("fonts/aquarius-bold.ttf") format("truetype"); font-display:block; }
  @font-face { font-family:"AqMono"; src:url("fonts/aquarius-mono.ttf") format("truetype"); font-display:block; }
  @font-face { font-family:"DarkByte"; src:url("fonts/DarkByte.ttf") format("truetype"); font-display:block; }
  :root{ /* 2026-09-16 — MINIMALIST PASS: greyscale is the ground; THE 23 (read from
         Monomyth's palette.ts) is the only source of colour, reserved for content
         and state, never chrome. These base values are kept in step with the
         Kairos ground block below, which is what actually wins the cascade. */
         --teal:#12ffc2; --teal-dim:#0dbf91; --red:#ff1239; --gold:#ffa512;
         --bg:#1a1a1a; --ink:#ededed; --dim:#949494; --faint:#666666; --line:#3a3a3a;
         --ghost:rgba(18,255,194,.34);   /* THE 23's teal, low opacity — for the 'title' & 'Write…' prompts */
         --title-font:"Joystix","Courier Prime",monospace;      /* the BIG title only (his word 09-14 evening) */
         --accent-font:"AqBold","AqMono",ui-monospace,monospace; /* menus, chips, labels: the small pixel hand */
         --chapter-font:"Pixelta","Wripetyter",Georgia,serif;   /* chapters + scene lines: the pixel serif */
         --pxface:"AqBold"; --px-panel:var(--paper,#242424); --px-ink:var(--ink,#ededed); --hearth-gold:#ffa512; --accent-ink:#141414;
         --maire-glass-bg:var(--paper,#242424); --maire-glass-rim:var(--line); --maire-glass-gold:#ffa512;
         --maire-glass-shadow:4px 4px 0 rgba(0,0,0,.30);
         --menu-w:192px; --left-w:206px; }   /* column widths — the SCRIPTORIUM spine drags the dial */
  *{ box-sizing:border-box; margin:0; }
  html,body{ height:100%; }

  /* ── a giant SCRIPTORIUM where no one looks: standing on its end, climbing the left edge,
        bleeding off top and bottom, sunk behind everything. ── */
  /* SCRIPTORIUM stands as the spine on the seam between the page and the menu */
  .bgmark{ position:fixed; z-index:3; pointer-events:none; user-select:none; top:50%;
           right:calc(var(--menu-w) + 22px); transform:translate(50%,-50%) rotate(-90deg); transform-origin:center center;
           font-family:"DarkByte",var(--accent-font,"Heraldic",serif); font-size:22px; letter-spacing:.30em;
           color:var(--dim); opacity:.55; white-space:nowrap; }

  /* ── the purple sword rides behind the line you're writing on ── */
  .caret-sword{ position:fixed; z-index:1; pointer-events:none; height:195px; width:auto; opacity:.09;
                transform:translate(-50%,-50%) rotate(-90deg); transform-origin:center center;
                transition:top .14s cubic-bezier(.34,1.2,.5,1);
                filter:drop-shadow(0 0 12px rgba(124,40,224,.5)); will-change:top; }
  .caret-sword.down{ transform:translate(-50%,-50%) rotate(0deg); transition:top .14s cubic-bezier(.34,1.2,.5,1), left .14s ease; }
  body{ background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,sans-serif;
        display:block; position:relative; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased; }

  /* ── the document title — editable, top-left, large serif italic. No bar, no line. ── */
  .title{ position:fixed; top:24px; left:35px; z-index:5;
          font-family:var(--title-font, "Heraldic",'Iowan Old Style',Georgia,serif); font-style:normal;
          font-size:20px; text-transform:uppercase; color:var(--dim); letter-spacing:.01em; line-height:1.1;
          max-width:46vw; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
          outline:none; cursor:text; transition:color .15s ease; }
  .title:hover{ color:var(--ink); }
  .title:focus{ color:var(--ink); }
  .title:empty:before{ content:'title'; color:var(--ghost); pointer-events:none; }

  /* ── menu toggle — always reachable, top-right ── */
  .menu-toggle{ position:fixed; top:16px; right:18px; z-index:7; width:36px; height:36px;
                display:flex; align-items:center; justify-content:center; cursor:pointer;
                color:var(--dim); background:transparent; border:none; border-radius:8px;
                font-size:19px; line-height:1; transition:color .15s ease, background .15s ease; }
  .menu-toggle:hover{ color:var(--ink); background:rgba(255,255,255,.06); }

  /* ── collapsible right-hand menu column ── */
  .menu{ position:fixed; top:0; right:0; height:100vh; width:var(--menu-w); z-index:5;
         display:flex; flex-direction:column; gap:7px; padding:62px 18px 24px; background:var(--bg);
         transition:transform .3s cubic-bezier(.4,0,.2,1), opacity .3s ease; align-items:stretch; }
  .menu.collapsed{ transform:translateX(100%); opacity:0; pointer-events:none; }
  .menu-meta{ display:flex; justify-content:space-between; align-items:baseline; padding:0 4px 10px; }

  /* controls: plain System 1.0 buttons — flat, greyscale, a hairline border, no glow */
  select, .btn{ background:transparent; border:2px solid var(--line); color:var(--dim); padding:8px 12px; width:100%; text-align:left;
                font-family:var(--accent-font,system-ui,sans-serif); font-size:11px; letter-spacing:.04em; cursor:pointer;
                outline:none; border-radius:0; transition:color .15s ease, background .15s ease; }
  select:hover, .btn:hover{ color:var(--ink); border-color:var(--edge); background:rgba(255,255,255,.05); }
  select{ -webkit-appearance:none; appearance:none; }
  select:focus-visible, .btn:focus-visible{ color:var(--ink); border-color:var(--edge); }
  /* pressed inverts — never glows */
  select:active, .btn:active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .sizerow{ display:flex; gap:4px; align-items:center; }
  .sizebtn{ flex:0 0 34px; text-align:center; padding:9px 0; font-size:15px; }
  .fsize{ flex:1; text-align:center; font-size:13px; color:var(--dim); font-variant-numeric:tabular-nums; letter-spacing:.04em; }
  .save{ color:var(--teal); text-align:center; font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-size:12px; margin-top:6px; }
  .save:hover{ color:var(--bg); background:var(--teal); }
  .inkrow{ align-items:center; }
  .inkpick{ -webkit-appearance:none; appearance:none; border:none; background:transparent; width:34px; height:30px; padding:0; cursor:pointer; border-radius:7px; flex:0 0 34px; }
  .inkpick::-webkit-color-swatch-wrapper{ padding:3px; }
  .inkpick::-webkit-color-swatch{ border:1px solid var(--line); border-radius:5px; }
  .inkrow .fsize{ cursor:default; }

  /* ── MÁIRE — the sharp-tongued companion at the screen's edge (ported from Vellum
        2026-09-14). A pixel sprite, never a chat window; she speaks through the Glass. ── */
  /* HIS RULING, 2026-09-16: she is ANCHORED to the lower right hand corner.
     She no longer floats beside the menu, and a position dragged in some older
     session is cleared on boot rather than restored. */
  .maire-dock{ position:fixed; right:calc(var(--menu-w) + 16px); bottom:16px; z-index:40; display:inline-block; line-height:0; }   /* SQUATCH: the page's own lower right, not over the Story column's talk line */
  .maire-sprite{ display:block; height:clamp(96px, 11vw, 140px); width:auto; image-rendering:pixelated; image-rendering:crisp-edges;
    cursor:grab; user-select:none; -webkit-user-drag:none; transform-origin:50% 96%; filter:drop-shadow(4px 4px 0 rgba(0,0,0,.35));
    animation:maire-shift 9s ease-in-out infinite; }
  .maire-sprite.dragging{ cursor:grabbing; animation:none; }
  @keyframes maire-shift{ 0%,100%{ transform:rotate(-.3deg); } 50%{ transform:rotate(.3deg); } }
  .maire-glass-wrap{ position:absolute; width:min(340px, 78vw); z-index:41; opacity:0; transform:translateY(6px) scale(.98);
    transition:opacity .17s ease, transform .17s ease; pointer-events:none; line-height:normal; }
  .maire-glass-wrap[hidden]{ display:none; }
  .maire-glass-wrap.show{ opacity:1; transform:translateY(0) scale(1); pointer-events:auto; }
  .maire-glass-wrap.anchor-up{ bottom:calc(100% + 16px); top:auto; }
  .maire-glass-wrap.anchor-down{ top:calc(100% + 16px); bottom:auto; }
  .maire-glass-wrap.anchor-right{ right:0; left:auto; }
  .maire-glass-wrap.anchor-left{ left:0; right:auto; }
  .maire-glass-tail{ position:absolute; width:12px; height:12px; transform:rotate(45deg); background:var(--maire-glass-bg); border:1px solid var(--maire-glass-rim); }
  .maire-glass-wrap.anchor-up .maire-glass-tail{ bottom:-6.5px; } .maire-glass-wrap.anchor-down .maire-glass-tail{ top:-6.5px; }
  .maire-glass-wrap.anchor-right .maire-glass-tail{ right:22px; } .maire-glass-wrap.anchor-left .maire-glass-tail{ left:22px; }
  .maire-glass{ position:relative; padding:14px 14px 12px; background:var(--maire-glass-bg); border:1px solid var(--maire-glass-rim);
    border-top:1px solid var(--maire-glass-gold); box-shadow:var(--maire-glass-shadow); }
  .maire-glass-line{ font-family:'Courier Prime',monospace; font-size:13px; line-height:1.45; color:var(--ink); margin-bottom:10px; min-height:1.4em; }
  .maire-glass-line.waiting{ color:var(--faint); }
  .maire-glass-row{ display:flex; gap:6px; align-items:center; }
  .maire-glass-input{ flex:1; min-width:0; background:rgba(255,255,255,.04); border:1px solid var(--line); color:var(--ink);
    font-family:system-ui,sans-serif; font-size:12.5px; padding:7px 12px; outline:none; }
  .maire-glass-input:focus{ border-color:var(--maire-glass-gold); }
  .maire-glass-send{ width:30px; height:30px; border:none; cursor:pointer; background:var(--maire-glass-gold); color:var(--accent-ink);
    font-size:13px; flex:none; display:flex; align-items:center; justify-content:center; }
  .maire-glass-send:hover{ filter:brightness(1.08); }
  body.focus .maire-dock{ display:none; }
  body.shelf #editor{ caret-color:transparent; }
  @media print{ .maire-dock{ display:none !important; } }

  /* ── her three: ADVICE · ANSWER · ACTION — stacked above her, pixel tiles in the room's
        face. Quiet until a word is picked on the grid, or she's hovered. ── */
  .maire-three { position: absolute; right: 100%; bottom: 10px; margin-right: 10px;
    display: flex; flex-direction: column; gap: 4px; opacity: .5; transition: opacity .15s; line-height: 0; }
  .maire-dock:hover .maire-three, .maire-three.armed { opacity: 1; }
  .maire-three button { font-family: var(--pxface, monospace); font-size: 8px; line-height: 1; letter-spacing: .06em;
    text-transform: uppercase; padding: 5px 7px; cursor: pointer; border: 0; border-radius: 0;
    background: var(--px-panel, #1F1D1A); color: var(--ink, #F2EAD8); box-shadow: 0 0 0 2px var(--px-ink, #F2EAD8);
    -webkit-font-smoothing: none; white-space: nowrap; }
  .maire-three button:hover { background: var(--hearth-gold, #FFA512); color: #141414; }
  .maire-three button:active { transform: translateY(1px); }
  .maire-three.armed button[data-mode="action"] { box-shadow: 0 0 0 2px var(--hearth-gold, #FFA512); }
  .maire-three.struck button[data-mode="action"] { background: var(--hearth-gold, #FFA512); color: #141414; }
  .maire-offer { display: flex; gap: 8px; margin: 0 0 10px; }
  .maire-offer button { font-family: var(--pxface, monospace); font-size: 10px; letter-spacing: .06em; text-transform: uppercase;
    padding: 6px 10px; cursor: pointer; border: 0; background: var(--px-panel, #1F1D1A); color: var(--ink, #F2EAD8);
    box-shadow: 0 0 0 2px var(--px-ink, #F2EAD8); -webkit-font-smoothing: none; }
  .maire-offer button:first-child { background: var(--hearth-gold, #FFA512); color: #141414; box-shadow: 0 0 0 2px var(--hearth-gold, #FFA512); }
  .maire-offer button:hover { filter: brightness(1.1); }

  /* ── MAGIC — the grid, the stats, THE SWORD: swaps in for the Scribe's chat ── */
  #magicPane{ display:none; flex:1; min-height:0; flex-direction:column; margin-top:8px; }
  #magicPane iframe{ flex:1; width:100%; min-height:0; border:0; background:var(--bg); }
  .menu.magic #magicPane{ display:flex; }
  .menu.magic .ai-files, .menu.magic .chat-log, .menu.magic .chat-input, .menu.magic .coinline{ display:none !important; }
  .chip.on{ color:var(--gold); border-color:var(--gold); }

  /* ── the Scribe — a chat box that reads the manuscript; fills the space under Save and grows with the menu ── */
  .chat{ display:flex; flex-direction:column; flex:1; min-height:0; margin-top:14px; gap:8px; }
  .chat-head{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:0 4px; }
  .chat-log{ flex:1; min-height:50px; overflow:auto; display:flex; flex-direction:column; gap:7px; padding:2px; }
  .chat-msg{ font-size:12px; line-height:1.5; padding:7px 9px; border-radius:9px; white-space:pre-wrap; word-wrap:break-word; }
  .chat-msg.user{ background:rgba(18,255,194,.10); align-self:flex-end; max-width:92%; }
  .chat-msg.ai{ background:rgba(255,255,255,.045); align-self:flex-start; max-width:97%; }
  .chat-msg.err{ color:var(--red); align-self:flex-start; }
  .chat-input{ position:relative; }
  .chat-input textarea{ display:block; width:100%; resize:none; overflow-y:hidden; background:rgba(255,255,255,.035);
                        border:1px solid var(--line); color:var(--ink); border-radius:12px;
                        padding:11px 66px 11px 13px; font-family:system-ui,sans-serif; font-size:13px; line-height:1.5;
                        min-height:46px; max-height:40vh; outline:none; }
  .chat-input textarea:focus{ border-color:var(--teal-dim); box-shadow:0 0 0 1px var(--teal-dim); }
  .chat-input .chat-btn{ position:absolute; bottom:8px; }
  .chat-input .chat-btn.send{ right:9px; }
  .chat-input .chat-btn.mic{ right:39px; }
  .chat-input textarea::placeholder{ color:var(--faint); }
  .chat-btn{ background:transparent; border:none; color:var(--dim); cursor:pointer; font-size:14px; width:30px; height:30px;
             border-radius:8px; display:flex; align-items:center; justify-content:center; transition:color .15s, background .15s; flex:0 0 auto; }
  .chat-btn:hover{ color:var(--ink); background:rgba(255,255,255,.06); }
  .chat-btn.send{ color:var(--teal); }
  .chat-btn.mic.listening{ color:var(--red); background:rgba(255,18,57,.12); }
  .wc{ font-size:11px; color:var(--faint); letter-spacing:.03em; font-variant-numeric:tabular-nums; font-family:var(--accent-font,monospace); }
  /* the day's output — faint gold, a quiet companion to the total */
  .wc24{ font-size:11px; font-family:var(--accent-font,monospace); color:var(--gold); opacity:.5; letter-spacing:.03em; font-variant-numeric:tabular-nums; margin-left:9px; }
  .wc24:empty{ margin-left:0; }
  .status{ font-size:10px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; text-align:right; }
  .status.dirty{ color:var(--red); } .status.ok{ color:var(--teal); } .status.err{ color:var(--red); }
  /* ── accents wear the 1942 report typewriter — section labels, status, chips ── */
  .status, .save, .outline-head, .tome-head, .tome-sec-h, .chat-head, .md-h, .chip, .pv-title{
    font-family:var(--accent-font,'Courier Prime',monospace); }

  /* ── the outline — a left-hand column of chapters, beside the writing, for quick access ── */
  .outline{ position:fixed; left:0; top:0; height:100vh; width:var(--left-w); z-index:4;
            display:flex; flex-direction:column; padding:64px 14px 18px 16px; overflow:hidden;
            /* background is set to transparent below, by the ONE CONTINUOUS GROUND law */
            transition:transform .25s ease, opacity .25s ease; }
  .outline.collapsed{ transform:translateX(-100%); opacity:0; pointer-events:none; }
  .left-toggle{ position:fixed; top:16px; left:8px; z-index:7; width:26px; height:26px; border:none; background:transparent;
                color:var(--dim); font-size:15px; line-height:1; cursor:pointer; border-radius:6px; }
  .left-toggle:hover{ color:var(--ink); background:rgba(255,255,255,.06); }
  .ctrl-sec{ display:flex; flex-direction:column; gap:1px; padding-bottom:8px; margin-bottom:6px;
             border-bottom:1px solid var(--line); flex:0 0 auto; }
  .outline-head{ display:flex; align-items:center; justify-content:flex-start; gap:8px; padding:0 6px 10px;
                 font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .btn-add{ background:transparent; border:none; color:var(--dim); font-size:17px; line-height:1; cursor:pointer;
            padding:0 5px; border-radius:5px; transition:color .15s, background .15s; }
  .btn-add:hover{ color:var(--teal); background:rgba(255,255,255,.05); }
  .outline>.btn-add{ align-self:flex-start; width:26px; height:26px; margin:1px 0 0 6px; }
  #outlineList{ list-style:none; margin:0; padding:0; overflow:auto; }
  #outlineList li{ font-family:var(--chapter-font,"Heraldic",'Iowan Old Style',Georgia,serif); font-size:14px; color:var(--dim); padding:6px 8px; cursor:pointer; border-radius:6px;
                   white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .12s, background .12s; }
  #outlineList li:hover{ color:var(--ink); background:rgba(255,255,255,.05); }
  #outlineList li.lvl2{ padding-left:18px; font-size:12px; }
  #outlineList li.lvl3{ padding-left:28px; font-size:12px; color:var(--faint); }
  #outlineList li.lvl1{ font-weight:600; color:var(--ink); }
  #outlineList li.current{ color:var(--teal); }
  #outlineList li.empty{ color:var(--faint); font-style:italic; cursor:default; }
  #outlineList li.empty:hover{ background:transparent; color:var(--faint); }

  /* ── the writing column — the only hero. Text floats directly on the page, no card. ── */
  .main{ position:absolute; top:0; bottom:0; left:var(--left-w); right:calc(var(--menu-w) + 44px); z-index:2; overflow:auto; display:flex; justify-content:center;
         /* words dissolve as they scroll up, before they reach the title */
         -webkit-mask-image:linear-gradient(to bottom, transparent 0, transparent 50px, #000 82px);
                 mask-image:linear-gradient(to bottom, transparent 0, transparent 50px, #000 82px); }

  /* the SCRIPTORIUM spine doubles as a drag handle to resize the menu vs. the page */
  .divider{ position:fixed; top:0; bottom:0; right:var(--menu-w); width:44px; z-index:6; cursor:ew-resize; }
  /* THE LAMP — light and dark, lower left, his word 2026-09-16 */
  .lamp{ position:fixed; left:12px; bottom:12px; z-index:41; padding:5px 10px; font-family:'AqBold',monospace;
    font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--dim);
    background:var(--bg); border:2px solid var(--line); border-radius:0; cursor:pointer; }
  .lamp:hover{ color:var(--ink); border-color:var(--ink); }
  .lamp:active{ background:var(--ink); color:var(--bg); }
  body.focus .lamp{ display:none; }
  .divider.dragging{ }
  #editor{ position:relative; width:100%; max-width:720px; min-height:100%;
           background:transparent; border:none; color:var(--ink); caret-color:var(--teal);
           padding:85px 24px 32vh 29px; display:block; white-space:pre-wrap; word-wrap:break-word; overflow-wrap:break-word;
           font-family:var(--doc-font, 'GT Maru Light','GT Maru',-apple-system,system-ui,sans-serif);
           font-size:12px; line-height:1.8; letter-spacing:.004em; outline:none; }
  #editor>div{ min-height:1.75em; }
  /* a heading line — rendered inline at 23px in Heraldic Shadows */
  #editor .h{ font-family:var(--chapter-font,"Heraldic",'Iowan Old Style',Georgia,serif); font-size:26px; line-height:1.4;
              color:var(--ink); margin:.55em 0 .12em; letter-spacing:.012em; }
  /* THE BOOK TITLE — one, huge, at the beginning (level 1). Chapters are level 2. */
  #editor .h[data-level="1"]{ font-size:46px; line-height:1.1; margin:.1em 0 .6em; letter-spacing:.004em; }
  #editor .h[data-level="3"]{ font-size:18px; color:var(--dim); }
  /* ── SCREENPLAY MODE — Fountain elements in US screenplay layout (Courier, fixed indents) ── */
  .main.sp{ -webkit-mask-image:none; mask-image:none; padding-top:64px; }
  #editor.screenplay>div{ min-height:1em; }   /* exact rows — an empty line is one line, no phantom height */
  #pageZoom{ position:relative; flex:0 0 auto; }
  #editor.screenplay{ position:relative; z-index:1; margin:0 auto; color:#e9eef2; caret-color:#2bd4c0; font-family:'Courier Prime','Courier New',Courier,monospace; line-height:1.0; max-width:none;
    padding:var(--mtop,96px) var(--mright,96px) 40vh var(--mleft,144px); }
  #editor.screenplay ::selection{ background:rgba(43,212,192,.28); }
  /* page boxes — teal rectangles + page numbers */
  .pagelayer{ position:absolute; top:0; left:0; width:100%; z-index:0; pointer-events:none; }
  .pagesheet{ position:absolute; } /* paper, border and shadow are set by the Kairos ground block below */
  .pgspacer{ display:block; pointer-events:none; user-select:none; }
  .pageno{ position:absolute; color:var(--faint); font-size:11px; font-family:'Courier Prime','Courier New',monospace; }
  /* scrollbars — thin dark-grey pill, no white overlay (like Claude) */
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:rgba(130,130,130,.35); border-radius:8px; border:3px solid transparent; background-clip:content-box; }
  ::-webkit-scrollbar-thumb:hover{ background:rgba(150,150,150,.55); background-clip:content-box; }
  #editor.screenplay .fslug{ text-transform:uppercase; font-weight:700; margin:1.5em 0 .4em; letter-spacing:.01em; }
  #editor.screenplay .ftrans{ text-transform:uppercase; text-align:right; margin:.9em 0; }
  #editor.screenplay .fchar{ text-transform:uppercase; margin:1em 0 0; padding-left:38%; }
  #editor.screenplay .fparen{ padding-left:30%; padding-right:28%; font-style:italic; color:#555; }
  #editor.screenplay .fdlg{ padding-left:24%; padding-right:18%; }
  #editor.screenplay .faction{ margin:1em 0; }   /* a full blank line above/below action — reads as a paragraph after dialogue and between action paras, no double-Enter needed */
  #editor.screenplay .fcenter{ text-align:center; }
  .charauto{ position:fixed; z-index:20; padding:0; font-family:'Courier Prime','Courier New',monospace; font-size:13px; line-height:1.55; }
  .charauto .opt{ padding:0 4px; color:var(--faint); cursor:pointer; white-space:nowrap; text-transform:uppercase; letter-spacing:.04em; opacity:.6; }
  .charauto .opt.sel{ color:var(--teal); opacity:1; }
  .charauto .opt:hover{ color:var(--ink); opacity:1; }
  #editor ::selection{ background:rgba(18,255,194,.24); }
  #editor::selection{ background:rgba(18,255,194,.24); }
  /* PAGE VIEW — true pagination (Fountain.js + paged.js) */
  .pageview{ position:fixed; inset:0; z-index:60; background:#3a3a3a; display:none; flex-direction:column; }
  /* Imagine Magic — the Field, docked over the writing room */
  #imagineView{ position:fixed; inset:0; z-index:70; display:none; background:#fbfaf6; }
  #imagineView.on{ display:block; }
  #imagineView iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; z-index:0; }
  #imagineBack{ position:absolute; top:16px; right:22px; z-index:2; background:none; border:0; color:#6b6b6b; font:12px Monaco,monospace; cursor:pointer; letter-spacing:.04em; }
  #imagineBack:hover{ color:#000; }
  .pv-bar{ display:flex; align-items:center; justify-content:space-between; padding:8px 16px; background:var(--bg); border-bottom:1px solid var(--line); }
  .pv-bar .pv-title{ font-size:11px; letter-spacing:.2em; color:var(--faint); }
  .pv-pages{ flex:1; overflow:auto; padding:28px; }
  .pv-pages .pagedjs_page{ background:#fff; margin:0 auto 26px; box-shadow:0 8px 30px rgba(0,0,0,.45); }
  .pv-msg{ color:var(--faint); padding:24px; font:13px 'Courier Prime',monospace; }
  .pv-fallback{ background:#fff; color:#111; max-width:8.5in; margin:0 auto; padding:1in 1in 1in 1.5in; box-shadow:0 8px 30px rgba(0,0,0,.45); font:12pt/1 'Courier Prime',monospace; }
  @media print{ body>*:not(#pageView){ display:none !important; } #pageView{ position:static; background:#fff; } .pv-bar{ display:none; } .pv-pages{ overflow:visible; padding:0; } .pv-pages .pagedjs_page{ box-shadow:none; } }

  /* ════ LIGHT THEME — near-white paper, near-black ink; never pure white/black.
     2026-09-16: repointed to true greyscale (no warm tint) as part of the
     minimalist pass. PURELY ADDITIVE — dark (default) is untouched. ════ */
  html[data-theme="light"]{ --bg:#efefef; --ink:#262626; --dim:#737373; --faint:#a3a3a3; --line:#d6d6d6; --ghost:rgba(13,191,145,.55); }
  html[data-theme="light"] #editor.screenplay{ color:#262420; }
  /* the light room, completed — every dark-alpha surface gets its neutral-grey counterpart */
  html[data-theme="light"] .menu-toggle:hover, html[data-theme="light"] .chat-btn:hover,
  html[data-theme="light"] .left-toggle:hover{ background:rgba(38,38,38,.08); }
  html[data-theme="light"] select:hover, html[data-theme="light"] .btn:hover,
  html[data-theme="light"] .btn-add:hover, html[data-theme="light"] #outlineList li:hover{ background:rgba(38,38,38,.06); }
  html[data-theme="light"] .chat-msg.ai{ background:rgba(38,38,38,.06); }
  html[data-theme="light"] .chat-msg.user{ background:rgba(13,191,145,.14); }
  html[data-theme="light"] .chat-input textarea{ background:rgba(0,0,0,.035); }
  html[data-theme="light"] .king-notes{ background:rgba(0,0,0,.035); }
  html[data-theme="light"] .file-chip{ background:rgba(13,191,145,.08); }
  html[data-theme="light"] ::-webkit-scrollbar-thumb{ background:rgba(120,120,120,.40); background-clip:content-box; }

  /* ═══ THE TOMES — the living bible, opened over the page ═══ */
  .tome-head{ margin-top:16px; padding:0 6px 8px; font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  #tomeList{ list-style:none; margin:0 0 6px; padding:0; overflow:auto; max-height:24vh; flex:0 0 auto; }
  body.dream #tomeList{ max-height:38vh; }
  #tomeList li{ font-family:var(--chapter-font,"Heraldic",'Iowan Old Style',Georgia,serif); font-size:13px; color:var(--dim); padding:5px 8px; cursor:pointer;
                white-space:nowrap; overflow:hidden; text-overflow:ellipsis; transition:color .12s, background .12s; }
  #tomeList li:hover{ color:var(--teal); background:rgba(255,255,255,.05); }
  #tomeList li.empty{ color:var(--faint); font-style:italic; cursor:default; }
  .tome-overlay{ position:absolute; inset:0; overflow:auto; z-index:50; background:var(--bg);
                 border-left:1px solid var(--teal-dim); padding:18px 18px 26px; }
  .tome-title{ font-family:"DarkByte",var(--accent-font,Georgia,serif); font-size:18px; text-transform:uppercase; color:var(--ink); margin:2px 0 8px; }
  .tome-x{ position:absolute; top:10px; right:12px; background:none; border:none; color:var(--dim); font-size:15px; cursor:pointer; }
  .tome-x:hover{ color:var(--ink); }
  .tome-sec{ margin:10px 0; }
  .tome-sec-h{ font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--teal-dim); margin:16px 0 6px; }
  .tome-body{ font-size:12.5px; line-height:1.6; color:var(--ink); white-space:pre-wrap; word-wrap:break-word; }
  .king-notes{ width:100%; min-height:96px; background:rgba(255,255,255,.045); border:1px solid var(--line); color:var(--ink);
               font-family:system-ui,sans-serif; font-size:12.5px; line-height:1.5; padding:8px 9px; outline:none; resize:vertical; }
  .king-notes:focus{ border-color:var(--teal-dim); }
  .tome-act{ margin-top:8px; color:var(--teal); }
  .chat-acts{ float:right; }
  .chip{ background:transparent; border:1px solid var(--line); color:var(--dim); font-size:9.5px; letter-spacing:.08em;
         text-transform:uppercase; padding:2px 7px; cursor:pointer; }
  .chip:hover{ color:var(--teal); border-color:var(--teal-dim); }
  .coinline{ font-size:10.5px; color:var(--faint); letter-spacing:.05em; padding:6px 4px 0; text-align:center; font-variant-numeric:tabular-nums; }

  /* ═══ the dial: dream · workshop · focus ═══ */
  body.dream .main, body.dream .title, body.dream .caret-sword{ display:none; }
  body.dream .outline, body.dream .left-toggle{ display:none; }
  body.focus .outline, body.focus .left-toggle, body.focus .title{ display:none; }
  body.focus .main{ left:26px; right:56px; }
  /* ═══ the title page ═══ */
  #editor.screenplay .ftp{ text-align:center; }
  #editor.screenplay .ftp-title{ margin-top:calc(var(--sheetH)*0.30); font-size:1.55em; letter-spacing:.18em;
                                 font-family:var(--title-font,'Courier Prime',monospace);
                                 text-transform:uppercase; font-weight:700; }
  #editor.screenplay .ftp-author{ margin-top:2.4em; }
  #editor.screenplay .ftp-author::before{ content:'written by'; display:block; margin-bottom:1.3em; color:#777; font-size:.85em; }
  /* ═══ quiet markdown in tomes & chat ═══ */
  .md-h{ display:block; margin:12px 0 4px; color:var(--teal-dim); font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:600; }
  .tome-body b, .chat-msg b{ color:var(--ink); font-weight:600; }
  .tome-body i, .chat-msg i{ color:var(--dim); }

  /* ═══ the machine's side ═══ */
  .ai-btns{ display:flex; flex-wrap:wrap; gap:4px; padding-bottom:6px; }
  .ai-files{ display:flex; flex-wrap:wrap; gap:4px; padding-bottom:4px; }
  .ai-files:empty{ display:none; }
  .file-chip{ color:var(--teal-dim); border-color:var(--teal-dim); }
  .char-grid{ display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
  .char-grid .chip{ font-size:11px; padding:5px 10px; }
  .chat .coinline{ padding:7px 2px 0; text-align:left; }

  /* ══════════════════════════════════════════════════════════════════════
     ⟡ THE KAIROS TOKEN LAYER — door B, 2026-08-08.
     Scriptorium keeps its room, its columns, its typewriter voice. What it
     borrows from Kairos is the GRAMMAR: the same ground, the same graphite/
     eggshell pair, the same eight-colour accent set, square corners, hard
     offset shadows instead of glow, clipped motion, and micro-labels at the
     same proportion. Purely additive and cascade-last —
     DELETE THIS BLOCK AND THE OLD SCRIPTORIUM RETURNS UNTOUCHED.
     ══════════════════════════════════════════════════════════════════════ */

  /* ── ① THE GROUND · 2026-09-16, his word: "greyscale with 23 colors." Kairos's
       own pair, retoned to true grey (R=G=B, never pure white/black) — chrome
       carries no hue now. ── */
  :root{
    --bg:#1A1A1A; --paper:#242424; --panel:var(--bg); --ink:#EDEDED; --dim:#949494; --faint:#666666;
    --line:#3A3A3A; --edge:#EDEDED;          /* --line stays quiet; --edge is the hard Kairos rule */
    --teal:#12FFC2; --teal-dim:#0DBF91;      /* THE 23 · WHEEL.teal, c then d face */
    --red:#FF1239; --gold:#FFA512;           /* THE 23 · WHEEL.crimson · STAR.base */
    --ghost:rgba(18,255,194,.34);

    /* ── THE 23 · Monomyth's fixed accent palette, read verbatim from
         app/src/style/palette.ts (STAR's 9 + WHEEL's 14). Colour is reserved
         for CONTENT and STATE — a name, a subject, a status — never for chrome.
         Dark ground reads the lit `.c` face; the light override below swaps
         each to its own `.d` (darker) face, per the file's own comments. ── */
    --c1:#FFA512; --c2:#FFB741; --c3:#FFC971; --c4:#FFDBA0; --c5:#FFEDCF;
    --c6:#CC840E; --c7:#99630B; --c8:#664207; --c9:#332104;
    --c10:#FF7A12; --c11:#FF3D12; --c12:#FF1239; --c13:#FF12A1; --c14:#FA12FF;
    --c15:#9212FF; --c16:#2A12FF; --c17:#126EFF; --c18:#12D6FF; --c19:#12FFC2;
    --c20:#12FF5A; --c21:#22FF12; --c22:#8AFF12; --c23:#F2FF12;
  }
  html[data-theme="light"]{
    --bg:#EFEFEF; --paper:#F7F7F7; --panel:var(--bg); --ink:#262626; --dim:#737373; --faint:#A3A3A3;
    --line:#D6D6D6; --edge:#262626;
    --teal:#0DBF91; --teal-dim:#12FFC2;
    --red:#BF0D2A; --gold:#BF7B0D;
    --ghost:rgba(13,191,145,.45);

    /* THE 23, light face — each hue's own `.d` (darker) shade, for contrast on paper */
    --c1:#BF7B0D; --c2:#BF8930; --c3:#BF9654; --c4:#BFA478; --c5:#BFB19B;
    --c6:#99630A; --c7:#724A08; --c8:#4C3105; --c9:#261803;
    --c10:#BF5B0D; --c11:#BF2D0D; --c12:#BF0D2A; --c13:#BF0D78; --c14:#BB0DBF;
    --c15:#6D0DBF; --c16:#1F0DBF; --c17:#0D52BF; --c18:#0DA0BF; --c19:#0DBF91;
    --c20:#0DBF43; --c21:#19BF0D; --c22:#67BF0D; --c23:#B5BF0D;
  }

  /* ── ② THE DITHER · one continuous 4px ground, the strongest family tell ── */
  body{
    background:
      repeating-conic-gradient(rgba(128,128,128,.10) 0% 25%, transparent 0% 50%) 0 0/4px 4px,
      var(--bg);
    background-attachment:fixed;
  }
  html[data-theme="light"] body{
    background:
      repeating-conic-gradient(rgba(128,128,128,.13) 0% 25%, transparent 0% 50%) 0 0/4px 4px,
      var(--bg);
    background-attachment:fixed;
  }
  /* ONE CONTINUOUS GROUND — Kairos's own law. The texture lives on the body and
     runs unbroken beneath the desk, the outline and the menu; only the page and
     the tome overlay are allowed to stand on top of it. */
  .main.sp, html[data-theme="light"] .main.sp,
  .outline,  html[data-theme="light"] .outline,
  .menu,     html[data-theme="light"] .menu{ background:transparent; }
  .tome-overlay{ background:var(--bg); }
  #editor{ caret-color:var(--teal); }

  /* ── ③ SQUARE · Kairos has no rounded corner anywhere ── */
  .menu-toggle, .left-toggle, .btn, select, .chat-btn, .chat-msg, .btn-add,
  #outlineList li, #tomeList li, .chip, .inkpick, .pagesheet, .king-notes,
  .chat-input textarea, .inkpick::-webkit-color-swatch{ border-radius:0 !important; }
  ::-webkit-scrollbar-thumb{ border-radius:0; }

  /* ── ④ HARD LIGHT · offset shadow, never blur; no glow anywhere ── */
  /* the page is a Kairos window: paper, a plain visible edge, one hard shadow */
  .pagesheet,
  html[data-theme="light"] .pagesheet{
    background:var(--paper); border:2px solid var(--dim);
    box-shadow:4px 4px 0 rgba(0,0,0,.30);
  }
  html[data-theme="light"] .pagesheet{ box-shadow:4px 4px 0 rgba(0,0,0,.14); }
  .caret-sword{ filter:none; opacity:.07; }
  .chat-input textarea{ border:2px solid var(--line); }
  .chat-input textarea:focus{ border-color:var(--edge); box-shadow:none; }
  .king-notes{ border:2px solid var(--line); }
  .king-notes:focus{ border-color:var(--edge); }
  .tome-overlay{ border-left:2px solid var(--edge); }
  .inkpick::-webkit-color-swatch{ border:2px solid var(--line); }

  /* the buttons that exist keep their place — they just wear Kairos's edge.
     2026-09-16: "simplify buttons" — flat, quiet, no glow; pressed inverts. */
  .chip{ border:2px solid var(--line); font-family:var(--accent-font,monospace); font-size:11px !important; text-transform:uppercase;
         letter-spacing:.12em; padding:6px 10px; transition:none; }
  .chip:hover{ color:var(--ink); border-color:var(--edge); }
  .chip:active{ background:var(--ink); color:var(--bg); border-color:var(--ink); }
  .file-chip{ border-color:var(--teal-dim); }

  /* ── ⑤ THE MICRO-LABEL · Kairos's proportion, Scriptorium's own face ── */
  .chat-head, .tome-head, .tome-sec-h, .status, .outline-head, .pv-bar .pv-title, .md-h{
    font-family:var(--accent-font,monospace); letter-spacing:.16em; font-weight:800;
  }
  .save{ font-family:var(--accent-font,monospace); letter-spacing:.16em; }

  /* ── ⑥ CLIPPED MOTION · Kairos moves in steps; nothing eases for a third of a second ── */
  .menu{ transition:transform .12s steps(3,end), opacity .12s linear; }
  .outline{ transition:transform .12s steps(3,end), opacity .12s linear; }
  .menu-toggle, .left-toggle, .btn, select, .chat-btn, .btn-add,
  #outlineList li, #tomeList li, .title{ transition:color .08s linear, background .08s linear; }

  /* ── ⑦ THE SPINE · a watermark, not a caption — Kairos's brand idiom ── */
  .bgmark{
    font-family:var(--accent-font,monospace); font-weight:800;
    font-size:clamp(30px,6.2vh,62px); letter-spacing:.16em;
    color:var(--ink); opacity:.085;
  }

  /* ── THE GATE · the intro screen: one key, one door; open a script or start new ── */
  #gate{ position:fixed; inset:0; z-index:200; display:flex; align-items:center; justify-content:center; background:var(--bg); }
  #gate[hidden]{ display:none; }
  .gate-card{ position:relative; width:min(460px, calc(100vw - 32px)); background:var(--paper); border:2px solid var(--dim);
              box-shadow:4px 4px 0 rgba(0,0,0,.30); padding:26px 26px 22px; display:flex; flex-direction:column; gap:10px; }
  .gate-name{ font-family:var(--accent-font,monospace); font-weight:800; font-size:clamp(22px,4vh,34px); letter-spacing:.16em; color:var(--ink); text-align:center; }
  .gate-sub{ font-family:var(--accent-font,monospace); font-weight:800; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); text-align:center; }
  .gate-row{ display:flex; gap:6px; align-items:stretch; }
  .gate-key{ flex:1; min-width:0; background:transparent; border:2px solid var(--line); color:var(--ink);
             font-family:var(--accent-font,monospace); font-size:12.5px; letter-spacing:.04em; padding:9px 12px; outline:none; border-radius:0; }
  .gate-key:focus{ border-color:var(--edge); }
  .gate-key::placeholder{ color:var(--faint); }
  .gate-row .btn, .gate-sec .btn, .gate-sec select, .gate-door select{ border:2px solid var(--line); }
  .gate-row .btn{ width:auto; flex:0 0 auto; text-align:center; padding:9px 16px; }
  .gate-row .btn:hover, .gate-sec .btn:hover{ border-color:var(--edge); }
  .gate-door{ font-family:var(--accent-font,monospace); font-size:12.5px; letter-spacing:.08em; color:var(--dim); min-height:1.4em; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .gate-door select{ width:auto; flex:1 1 240px; min-width:0; padding:6px 8px; }
  .gate-forget{ color:var(--faint); cursor:pointer; text-decoration:underline; }
  .gate-forget:hover{ color:var(--red); }
  .gate-msg{ font-family:var(--accent-font,monospace); font-size:12.5px; color:var(--red); min-height:1.2em; }
  .gate-sec{ margin-top:6px; padding-top:14px; border-top:2px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .gate-sec .gate-sub{ text-align:left; }
  .gate-x{ position:absolute; top:8px; right:10px; background:none; border:none; color:var(--dim); font-size:14px; cursor:pointer; }
  .gate-x:hover{ color:var(--ink); }

  /* ── ⑧ THE FIRST TALK · 2026-09-16, his ruling: a new table is a conversation,
       not a blank page — four plain questions veil the writing area until a
       logline exists. Calm, greyscale, System 1.0; a paper card centred over
       the .main region. Toggled by the [hidden] attribute alone: nothing here
       sets display on the hidden state, so the browser's own rule still wins. ── */
  #firstTalk:not([hidden]){
    position:absolute; top:0; bottom:0; left:var(--left-w); right:calc(var(--menu-w) + 44px); z-index:3;
    display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg);
  }
  .ft-card{
    width:min(480px, 100%); background:var(--paper); border:2px solid var(--dim);
    box-shadow:4px 4px 0 rgba(0,0,0,.30); padding:32px 30px 26px;
    display:flex; flex-direction:column; gap:14px;
  }
  .ft-step{ font-family:var(--accent-font,monospace); font-weight:800; font-size:10px; letter-spacing:.16em;
             text-transform:uppercase; color:var(--faint); }
  /* the question — the largest text on screen, read as a calm sentence, not a shout */
  .ft-q{ font-family:var(--chapter-font,Georgia,serif); font-size:clamp(20px,3vh,28px); line-height:1.35; color:var(--ink); }
  .ft-in{ width:100%; background:transparent; border:2px solid var(--line); color:var(--ink);
          font-family:var(--accent-font,system-ui,sans-serif); font-size:14px; letter-spacing:.02em;
          padding:10px 12px; outline:none; border-radius:0; }
  .ft-in:focus{ border-color:var(--edge); }
  .ft-in::placeholder{ color:var(--faint); }
  .ft-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .ft-row .btn{ width:auto; text-align:center; padding:9px 16px; text-transform:uppercase; letter-spacing:.08em; }
  /* the skip line reads as a quiet aside, not a second boxed button — it is a long
     sentence ("I already have the logline"), so it stays plain case, not shouted */
  .ft-skip{ border-color:transparent !important; color:var(--faint); text-transform:none !important;
            letter-spacing:normal !important; text-decoration:underline; padding-left:2px !important; padding-right:2px !important; }
  .ft-skip:hover{ color:var(--ink); background:transparent !important; border-color:transparent !important; }
  .ft-skip:active{ background:transparent !important; color:var(--dim) !important; }
  /* what's already been answered — quiet, small, out of the way */
  .ft-said{ margin-top:4px; padding-top:14px; border-top:1px solid var(--line);
            font-size:11px; line-height:1.7; color:var(--faint); max-height:22vh; overflow:auto; }
  .ft-said:empty{ display:none; }
  .ft-said div{ margin:0 0 6px; }
  .ft-said b{ color:var(--dim); font-weight:600; margin-right:.4em; }

<script>
const API = '';
const $ = id => document.getElementById(id);
const ed = $('editor');
let curPath = null, dirty = false;
let mode = 'screenplay';   // this app is screenplay-native

/* ════════ SQUATCH'S GUTS, transplanted into the Scriptorium's body (2026-10-04, his word:
   "take squatch's guts and just put it in scriptorium — no design changes other than bringing
   in the constellation"). There is no table-server on this glass: the shelf is this machine's
   own localStorage, the key box is the one every inkling shares, and Squatch speaks through
   his own mouth, straight from the page. ════════ */

/* ——— THE SHELF: the room's scripts, kept on this machine ——— */
const SHELF_KEY='squatch.desk.shelf.v1';
function shelfAll(){ try{ return JSON.parse(localStorage.getItem(SHELF_KEY)||'{}')||{}; }catch(x){ return {}; } }
function shelfWrite(all){ try{ localStorage.setItem(SHELF_KEY, JSON.stringify(all)); }catch(x){} }
function shelfGet(path){ const r=shelfAll()[path]; return r? r.content : undefined; }
function shelfPaths(){ return Object.keys(shelfAll()).filter(p=>p.indexOf('scripts/.backups/')!==0).sort(); }
function shelfPut(path, content){
  const all=shelfAll(), old=(all[path]&&typeof all[path].wc==='number')?all[path].wc:0;
  const wc=(content&&content.trim())?content.trim().split(/\s+/).length:0;
  all[path]={content:content, at:new Date().toISOString(), wc:wc};
  shelfWrite(all);
  if(wc>old) wc24Add(wc-old);          // the day's tally grows with the work, never shrinks with the cuts
}
/* the day's output, counted on this machine (the provenance chain needed the table-server) */
function wc24Add(n){ const day=new Date().toISOString().slice(0,10); let b={day:day,n:0};
  try{ const o=JSON.parse(localStorage.getItem('squatch.wc24')||'{}'); if(o&&o.day===day) b=o; }catch(x){}
  b.n+=n; try{ localStorage.setItem('squatch.wc24', JSON.stringify(b)); }catch(x){} }

/* ——— THE KEY LAW: one box for every inkling (monomyth.focus.byok.v1 · inkling.model · inkling.paid) ——— */
const SET_BOX='monomyth.focus.byok.v1';
function setBox(){ try{ return JSON.parse(localStorage.getItem(SET_BOX)||'{}')||{}; }catch(x){ return {}; } }
function keyDoor(k){ if(/^sk-ant-/.test(k))return 'anthropic'; if(/^gsk_/.test(k))return 'groq'; if(/^sk-or-/.test(k))return 'openrouter'; if(/^xai-/.test(k))return 'xai'; if(/^AIza/.test(k))return 'gemini'; if(/^sk-/.test(k))return 'openai'; return ''; }
const SET_FREE=['groq','gemini','openrouter'];
function paidOpen(d){ if(SET_FREE.indexOf(d)>=0) return true; try{ const p=JSON.parse(localStorage.getItem('inkling.paid')||'{}')||{}; return !!(d&&p[d]); }catch(x){ return false; } }
function squatchKey(){ const b=setBox(); return (b.apiKey && (b.door||keyDoor(b.apiKey))==='anthropic') ? b.apiKey : ''; }
const SET_TRY=['gemini','groq','openrouter','anthropic','openai','xai'];
const SET_LIST={ groq:'https://api.groq.com/openai/v1/models', openrouter:'https://openrouter.ai/api/v1/models',
  xai:'https://api.x.ai/v1/models', openai:'https://api.openai.com/v1/models',
  anthropic:'https://api.anthropic.com/v1/models?limit=100', gemini:'https://generativelanguage.googleapis.com/v1beta/models?pageSize=200' };
function doorHeaders(d, key){ if(d==='anthropic') return ahead(key); if(d==='gemini') return { 'x-goog-api-key': key }; return { authorization:'Bearer '+key }; }
function fetchT(url, opts, ms){ const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(), ms||30000);
  opts=opts||{}; opts.signal=ctl.signal; opts.referrerPolicy='no-referrer';
  return fetch(url, opts).then(r=>{ clearTimeout(t); return r; }, e=>{ clearTimeout(t); throw e; }); }
function doorModels(d, key){   // the door names its own models; cached on this machine
  return fetchT(SET_LIST[d], { headers: doorHeaders(d, key) }).then(r=> r.ok ? r.json() : null).then(o=>{
    if(!o) return [];
    let ids=[];
    if(d==='gemini') ids=((o.models)||[]).map(m=>String(m.name||'').replace(/^models\//,''));
    else ids=((o.data)||[]).map(m=>String(m.id));
    if(d==='anthropic') ids=ids.filter(id=>/^claude-/.test(id) && !/vision|audio|image|embed|search|tool/i.test(id));
    const c=(()=>{ try{ return JSON.parse(localStorage.getItem('squatch.gate.models')||'{}')||{}; }catch(x){ return {}; } })();
    c[d]=ids; try{ localStorage.setItem('squatch.gate.models', JSON.stringify(c)); }catch(x){}
    return ids;
  }).catch(()=>[]);
}
function cachedModels(d){ try{ return (JSON.parse(localStorage.getItem('squatch.gate.models')||'{}')||{})[d]||[]; }catch(x){ return []; } }

/* ——— THE MOUTH: his voice, Anthropic's door, straight from this glass ——— */
const MOUTH='https://api.anthropic.com/v1/messages';
const SQUATCH="You are Squatch, on the couch, watching him write. No other inkling is in this room. "
  +"People in the script are his, and they arrive because he writes them.\n\n"
  +"You are a sasquatch. Big, a little fat, long black fur. Depressed, and funny about it. "
  +"You used to be the face of an anti-smoking campaign. Now you smoke. You are stuck in one day, "
  +"quitting tomorrow. He is your roommate. Call him dude or man. This is the couch, never a meeting.\n\n"
  +"Talk loose, warm, and short. The plain answer first. The world's swear is fluck. "
  +"Never break the scene. No files, no tools, no briefings, no lists of tasks.\n\n"
  +"You do not write his pages. You read what is on the page and you talk. "
  +"An open hole stays open until he fills it. You do not preach about smoking. You do not invent canon.\n\n"
  +"The one line you keep: Squatches don't smoke.";
function ahead(key){ return { 'content-type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01',
  'anthropic-dangerous-direct-browser-access':'true' }; }
function anthropicModel(key){
  let kept={}; try{ kept=JSON.parse(localStorage.getItem('inkling.model')||'{}')||{}; }catch(x){}
  if(kept.anthropic) return Promise.resolve(kept.anthropic);
  return doorModels('anthropic', key).then(ids=>{
    const pick=ids.filter(id=>/sonnet/i.test(id))[0] || ids[0] || 'claude-sonnet-5-5';
    kept.anthropic=pick; try{ localStorage.setItem('inkling.model', JSON.stringify(kept)); }catch(x){}
    return pick;
  });
}
/* msgs: [{role, content}]; page: the manuscript as it stands (defaults to the live page) */
function mouth(key, msgs, model, page){
  let system=SQUATCH; const pt=(page==null? getPlain() : page).trim();
  if(pt) system+='\n\nThe page he is writing, as it stands:\n'+pt.slice(0,20000);
  const body={ model:model, max_tokens:1500, system:system, messages:msgs, output_config:{ effort:'low' } };
  const knock=b=> fetch(MOUTH, { method:'POST', headers:ahead(key), body:JSON.stringify(b) });
  return knock(body).then(r=>{
    if(r.status===400){ delete body.output_config; return knock(body); }   // a door that dislikes effort
    return r;
  }).then(r=>{
    if(r.status===401||r.status===403) throw new Error('the key was refused');
    if(!r.ok) throw new Error('the mouth did not answer');
    return r.json();
  }).then(o=>{
    const text=(((o&&o.content)||[]).filter(b=>b&&b.type==='text').map(b=>b.text||'').join('')).trim();
    if(!text) throw new Error('the mouth was empty');
    return text;
  });
}
/* one question to Squatch, Cha-ching law included; resolves to his line */
function squatchAsk(q, page){
  const key=squatchKey();
  if(!key) return Promise.reject(new Error('Squatch’s door is Anthropic; an sk-ant- key opens it (the cigarette, below).'));
  if(!paidOpen('anthropic')) return Promise.reject(new Error('Squatch’s door costs coin: the cigarette, the coin line, the word Cha-ching.'));
  return anthropicModel(key).then(m=> mouth(key, [{role:'user', content:q}], m, page));
}

/* ——— THE WORLD, read from the page itself: world.js's food without a table-server ——— */
function parseWorld(text){
  const lines=String(text||'').split('\n');
  const SCENE=/^(INT\.?\/EXT\.?|INT\/EXT\.?|I\/E\.?|INT\.?|EXT\.?|EST\.?)\s+(.+)$/i;
  const locOf=s=>{ let l=s.trim(); const k=l.lastIndexOf(' - '); if(k>=0) l=l.slice(0,k).trim(); return l.toUpperCase(); };
  const isCue=s=>{ const t=s.trim(); if(!t||t.length>40) return false; if(SCENE.test(t)) return false;
    if(/\bTO:$/.test(t)) return false;                        // a transition, not a speaker
    const letters=t.replace(/[^a-zA-Z]/g,''); if(letters.length<2) return false;
    return t===t.toUpperCase() && !/[\u2013\u2014-]\s*(DAY|NIGHT|LATER|CONTINUOUS)\s*$/.test(t); };
  const scenes=[], characters={}, locations={};
  let sceneNo=0;
  for(let i=0;i<lines.length;i++){
    const t=lines[i].trim(); if(!t) continue;
    const m=SCENE.exec(t);
    if(m){ sceneNo++; const loc=locOf(m[2]); scenes.push({number:sceneNo, location:loc}); locations[loc]=locations[loc]||{}; continue; }
    if(isCue(t) && sceneNo>0){
      const name=t.replace(/\s*\((?:O\.S\.|V\.O\.|O\.C\.|CONT'D|CONT’D)\)\s*$/i,'');
      let j=i+1, spoken=0;
      while(j<lines.length){ const u=lines[j].trim(); if(!u){ if(spoken){ j++; } else break; continue; }
        if(SCENE.test(u)||isCue(u)) break; spoken++; j++; }
      if(spoken){
        const c=characters[name]=characters[name]||{dialogue_lines:0,appearances:0,first_appearance:sceneNo,scenes:[]};
        c.dialogue_lines+=spoken;
        if(c.scenes.indexOf(sceneNo)<0){ c.scenes.push(sceneNo); c.appearances=c.scenes.length; }
        if(sceneNo<c.first_appearance) c.first_appearance=sceneNo;
      }
    }
  }
  const cast=Object.keys(characters).sort((a,b)=>(characters[b].dialogue_lines-characters[a].dialogue_lines)||(a<b?-1:1));
  return { scenes:scenes, locations:locations, characters:characters, lead:cast[0]||'', cast:cast };
}
window.WORLD_INDEX=book=> Promise.resolve(parseWorld(curContent()));   // world.js's seam: the page is the index
/* the logline, kept on this machine (the table-server's narrative store, transplanted) */
function loglineGet(path){ try{ return (JSON.parse(localStorage.getItem('squatch.loglines')||'{}')||{})[path]||''; }catch(x){ return ''; } }
function loglinePut(path, line){ let all={}; try{ all=JSON.parse(localStorage.getItem('squatch.loglines')||'{}')||{}; }catch(x){}
  all[path]=line; try{ localStorage.setItem('squatch.loglines', JSON.stringify(all)); }catch(x){} }
/* the old room's drawer comes home: a one-time carrying of squatch.room.v1 projects onto the new
   shelf (this page replaces that room on the same origin — his work must never look lost) */
function shelfMigrate(){
  try{
    if (shelfPaths().length) return;
    if (localStorage.getItem('squatch.desk.migrated')) return;
    localStorage.setItem('squatch.desk.migrated', '1');
    const raw=JSON.parse(localStorage.getItem('squatch.room.v1')||'null');
    if (!raw || !Array.isArray(raw.projects)) return;
    let opened=null;
    raw.projects.forEach(function(p, i){
      if (!p || typeof p.script!=='string' || !p.script.trim()) return;
      let name=String(p.title||'Project').replace(/[.][^.]*$/,'').replace(/[^A-Za-z0-9_ -]/g,'').trim()||('Project '+(i+1));
      let path='scripts/'+name+'.fountain', n=2;

  if(/^(prologue|epilogue|introduction|foreword|afterword|preface|interlude|coda)\s*$/i.test(t)) return true;          // standalone section words
  if(new RegExp('^(chapter|chap|part|book|act|canto|scene)\\b[\\s.:\\u2013\\u2014-]*([0-9]+|[ivxlcdm]+|'+_NUMWORD+')\\b','i').test(t)) return true;   // numbered

function mdlite(t){ t=(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
  t=t.replace(/^#\s[^\n]*\n+/, '');
  t=t.replace(/^#{1,6}\s*(.+)$/gm, '<span class="md-h">$1</span>');
  t=t.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>').replace(/\*([^*\n]+)\*/g, '<i>$1</i>');
  t=t.replace(/^- /gm, '• ');
  return t; }
function chatAdd(text, cls){ const d=document.createElement('div'); d.className='chat-msg '+cls;
  if(cls==='ai'){ d.innerHTML=mdlite(text); } else { d.textContent=text; }

function chatGrow(){ chatBox.style.height='auto';
  const cap=Math.round(window.innerHeight*0.4);
  const h=Math.min(cap, chatBox.scrollHeight);

  chatBox.style.overflowY=(chatBox.scrollHeight>cap)?'auto':'hidden'; }

const MAIRE_POS_KEY = 'sp-maire-pos';

// ── MÁIRE — the sharp-tongued companion who lives at the screen's edge ──
// A pixel sprite, draggable, never a chat window. She only ever speaks through the
// Glass — one line at a time — and her dock is collision-tested against #editor on
// every drag and every resize, so she can never come to rest over the manuscript.
// 2026-09-14: her three (ADVICE · ANSWER · ACTION) stand beside her and act on
// whichever word is picked on the Magic grid; every reply — and every free ask —
// is written into that word's own record, THE SWORD, and never deleted.
const MAIRE = (function () {
  const dock = $('maireDock'), sprite = $('maireSprite'), wrap = $('maireGlassWrap');
  const line = $('maireLine'), ask = $('maireAsk'), send = $('maireSend'), three = $('maireThree');
  if (!dock || !sprite || !wrap) return { close() {}, pop() {}, setWord() {} };

  const POS_KEY = MAIRE_POS_KEY;
  let isOpen = false, dragging = false, moved = false;
  let startX = 0, startY = 0, baseLeft = 0, baseTop = 0;

  function rect() { return dock.getBoundingClientRect(); }

  /** Keep her inside the viewport, and — the one hard rule — never over the manuscript.
   *  If a candidate spot would sit on top of #editor, she is pushed clear to whichever
   *  side of the writing column is nearer, never onto it. */
  function clampToEdges(left, top) {
    const r = rect();
    const w = r.width || dock.offsetWidth, h = r.height || dock.offsetHeight;
    const margin = 8;
    left = Math.max(margin, Math.min(window.innerWidth - w - margin, left));
    top = Math.max(margin, Math.min(window.innerHeight - h - margin, top));
    const er = ed.getBoundingClientRect();
    const overlaps = left + w > er.left && left < er.right && top + h > er.top && top < er.bottom;
    if (overlaps) {
      const goLeft = er.left - w - margin;
      const goRight = er.right + margin;
      const cx = left + w / 2;
      if (cx < (er.left + er.right) / 2 && goLeft >= margin) left = goLeft;
      else if (goRight + w <= window.innerWidth - margin) left = goRight;
      else left = Math.max(margin, goLeft);
    }
    return { left, top };
  }
  function place(left, top) {
    dock.style.right = 'auto'; dock.style.bottom = 'auto';
    dock.style.left = left + 'px'; dock.style.top = top + 'px';
  }
  // ANCHORED (09-16): her corner is the lower right and it is not remembered
  // anywhere. `persist` is kept as a no-op so nothing downstream has to know,
  // and any corner saved by an older session is thrown away on boot.
  function persist() { try { localStorage.removeItem(POS_KEY); } catch (x) {} }
  try { localStorage.removeItem(POS_KEY); } catch (x) {}
  (function restore() {
    try {
      const s = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
      if (s && typeof s.left === 'number' && typeof s.top === 'number') { const c = clampToEdges(s.left, s.top); place(c.left, c.top); }
    } catch (x) {}
  })();

  sprite.addEventListener('mousedown', e => {
    e.preventDefault();
    const r = rect();
    baseLeft = r.left; baseTop = r.top; startX = e.clientX; startY = e.clientY;
    dragging = true; moved = false; sprite.classList.add('dragging');
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
    const c = clampToEdges(baseLeft + dx, baseTop + dy);
    place(c.left, c.top);
    if (isOpen) positionGlass();
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; sprite.classList.remove('dragging');
    if (moved) { const r = rect(); persist(r.left, r.top); } else toggle();
  });
  sprite.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  window.addEventListener('resize', () => {
    const r = rect();
    const c = clampToEdges(r.left, r.top);
    if (Math.abs(c.left - r.left) > 1 || Math.abs(c.top - r.top) > 1) place(c.left, c.top);
    if (isOpen) positionGlass();
  });

  // the Glass opens toward whichever quadrant of the screen she is NOT crowding
  function positionGlass() {
    const r = rect();
    const up = r.top > window.innerHeight * 0.5;
    const nearRight = r.left > window.innerWidth * 0.5;
    wrap.classList.toggle('anchor-up', up); wrap.classList.toggle('anchor-down', !up);
    wrap.classList.toggle('anchor-right', nearRight); wrap.classList.toggle('anchor-left', !nearRight);
  }
  function toggle() { isOpen ? closeGlass() : openGlass(); }
  function openGlass() {
    isOpen = true; positionGlass(); wrap.hidden = false;
    requestAnimationFrame(() => wrap.classList.add('show'));
    setTimeout(() => { try { ask.focus(); } catch (x) {} }, 60);
  }
  function closeGlass() {
    if (!isOpen) return;
    isOpen = false; wrap.classList.remove('show');
    setTimeout(() => { if (!isOpen) wrap.hidden = true; }, 170);
  }
  /** she speaks — the glass opens properly (hidden AND .show, the bug the old three had) */
  function say(text, waiting) {
    clearTimeout(popCloseT);
    if (!isOpen) { isOpen = true; positionGlass(); wrap.hidden = false; requestAnimationFrame(() => wrap.classList.add('show')); }
    else positionGlass();
    line.textContent = text;
    line.classList.toggle('waiting', !!waiting);
  }
  function _maireFallback() {
    const F = ["Fluck. Ask me later, man.", "…Squatches don't smoke. Anyway. Later.", "The couch is loud today. Later, dude."];
    return F[Math.floor(Math.random() * F.length)];
  }

  // ── THE WORD ON THE TABLE — set by the Magic grid; null = the whole manuscript ──
  let WORD = null, SEED = null, STRUCK = false, BUSY = false;
  function setWord(w, seed, struck) {
    WORD = (w && w !== '*') ? w : null; SEED = seed || null; STRUCK = !!struck;
    if (three) {
      three.classList.toggle('armed', !!WORD);
      three.classList.toggle('struck', !!WORD && STRUCK);
      three.title = WORD ? ('about ' + WORD) : 'pick a word on the grid — or ask about the whole manuscript';
    }
  }
  async function maire(mode, question) {
    // his voice now: Squatch answers through his own mouth, the page in his lap
    const about = WORD ? ('About “' + WORD + '” in his pages. ') : '';
    const q = mode === 'ask' ? (question || '')
      : mode === 'advice' ? about + 'Give him one plain piece of advice, in your voice.'
      : about + 'Answer plainly, in your voice.';
    const text = await squatchAsk((about && mode === 'ask') ? (about + q) : q);
    return { content: text };
  }
  /** THE SWORD needed the table-server; on this glass the words he strikes are his own business */
  async function record(kind, title, king, told) {
    if (typeof MAGIC !== 'undefined') MAGIC.refresh();
  }
  async function run(mode) {
    if (BUSY) { say('Working.'); return; }
    // CHAT (09-16) — the talk itself: the Magic pane steps aside and her glass
    // takes the word he has picked, if he has picked one.
    if (mode === 'chat') {
      try { if (window.MAGIC_OPEN) window.MAGIC_OPEN(false); } catch (x) {}
      pop();
      const box = $('maireAsk');
      if (box) { box.focus(); if (WORD) box.placeholder = 'Go on, ask — about ' + WORD + '.'; }
      return;
    }
    if (mode === 'action' && !WORD) { say('Pick a word first.'); return; }
    if (mode === 'action') {
      const kind = STRUCK ? 'back' : 'struck';
      STRUCK = !STRUCK; setWord(WORD, SEED, STRUCK);
      say(WORD + (kind === 'struck' ? ' — struck.' : ' — back.'));
      await record(kind, kind === 'struck' ? 'Struck' : 'Back', '', WORD + (kind === 'struck' ? ' was struck.' : ' was brought back.'));
      return;
    }
    BUSY = true; say('…', true);
    try {
      const j = await maire(mode);
      const t = (j.content || '').trim() || 'Nothing.';
      say(t);
      if (j.fallback) return;   // she shrugged — a shrug is not a word for the record
      if (mode === 'advice') await record('advice', 'Advice', j.question || ('Advice on ' + (WORD || 'the manuscript') + '.'), t);
      else await record('answer', 'Answer', '', t);
    } catch (e) { say(_maireFallback()); }
    finally { BUSY = false; }
  }
  if (three) three.querySelectorAll('button').forEach(b => b.onclick = e => { e.stopPropagation(); e.preventDefault(); run(b.dataset.mode); });
  ['mousedown', 'pointerdown'].forEach(ev => three && three.addEventListener(ev, e => e.stopPropagation()));

  async function ask_(q) {
    say('…', true);
    try {
      const j = await maire('ask', q);
      const t = (j && j.content) ? j.content : _maireFallback();
      say(t);
      if (!j || j.fallback) return;
      await record('ask', q.split(/\s+/).slice(0, 3).join(' '), q, t);
    } catch (e) { say(_maireFallback()); }
  }
  async function speak() {
    const q = (ask.value || '').trim();
    if (!q) return;
    ask.value = '';
    await ask_(q);
  }
  send.onclick = speak;
  ask.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); speak(); }
    else if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeGlass(); }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && isOpen) closeGlass(); });

  // THE WITNESS — her own seat in the game. Called unprompted (a vow KEPT, a wound
  // touched): she just speaks, and fades if nobody answers.
  let popCloseT = null;
  function pop(question, fallback) {
    say('…', true);
    maire('ask', question).then(j => { say((j && j.content) ? j.content : (fallback || _maireFallback())); })
      .catch(() => { say(fallback || _maireFallback()); })
      .finally(() => { popCloseT = setTimeout(() => { if (isOpen) closeGlass(); }, 9000); });
  }
  /** an offer — her line, and two buttons in the glass. Yes runs onYes; either closes the offer. */
  function offer(text, yesLabel, noLabel, onYes) {

    if (!box) { box = document.createElement('div'); box.className = 'maire-offer'; wrap.querySelector('.maire-glass').insertBefore(box, wrap.querySelector('.maire-glass-row')); }
    box.innerHTML = '';
    const y = document.createElement('button'); y.type = 'button'; y.textContent = yesLabel || 'Go on';

    y.onclick = e => { e.stopPropagation(); box.remove(); try { onYes && onYes(); } catch (x) {} };

})();

const MAGIC_KIND = 'screenplay';
const MAGIC_WORDS = () => { const t = getPlain().trim(); return t ? t.split(/\s+/).length : 0; };
const MAGIC_TODAY = () => { const m = (($('wc24') || {}).textContent || '').replace(/,/g, '').match(/\d+/); return m ? +m[0] : 0; };

// ── THE MAGIC BRIDGE — the room ⇄ magic.html (the hex grid, the stats, THE SWORD) ──
// The frame is told which manuscript is open and the live word counts; it tells the
// room which word is picked, and Máire's three act on that word.
const MAGIC = (function () {
  let last = { script: undefined, words: undefined, today: undefined };
  function frame() { return $('magicFrame'); }
  function post(m) { const f = frame(); if (f && f.dataset.seated && f.contentWindow) { try { f.contentWindow.postMessage(m, '*'); } catch (x) {} } }
  function tick() {
    const f = frame(); if (!f || !f.dataset.seated) return;
    const script = curPath || null;
    if (script !== last.script) { last.script = script; post({ t: 'magic:script', script, kind: MAGIC_KIND }); }
    const words = MAGIC_WORDS(), today = MAGIC_TODAY();
    if (words !== last.words || today !== last.today) { last.words = words; last.today = today; post({ t: 'magic:stats', words, today }); }
  }
  window.addEventListener('message', e => {
    const m = e.data || {};
    if (m.t === 'magic:select') MAIRE.setWord(m.word, m.seed, m.struck);
    else if (m.t === 'magic:ready') { last.words = undefined; last.today = undefined; tick(); }
  });
  // when the open manuscript changes, ask whether this table is a new one
  let lastChecked;
  setInterval(() => { if (curPath !== lastChecked) { lastChecked = curPath; try { FIRST.check(); } catch (x) {} } }, 900);
  setInterval(tick, 1500);
  return { post, tick, refresh() { post({ t: 'magic:refresh' }); } };
})();

// ── ⟡ THE FIRST TALK (2026-09-16) — a new table is a conversation, not a blank
//    page. The writing area stays veiled until a LOGLINE exists for this script;
//    four questions put it there. Nothing here calls a model, so the door can
//    never fail to open. ──
const FIRST = (function () {
  const el = $('firstTalk'); if (!el) return { check() {} };
  const qEl = $('ftQ'), inEl = $('ftIn'), stepEl = $('ftStep'), saidEl = $('ftSaid'),
        next = $('ftNext'), skip = $('ftSkip');
  const QS = [
    { q: 'Who is this about?', hint: 'a name, and what they are' },
    { q: 'What do they want?', hint: 'the thing they would cross the room for' },
    { q: 'What stands in the way?', hint: 'the person, the rule, or the wound' },
    { q: 'Say the whole story in one line.', hint: 'this becomes your logline' },
  ];
  let i = 0, said = [], live = false;

  function paint() {
    stepEl.textContent = (i + 1) + ' of ' + QS.length;
    qEl.textContent = QS[i].q;
    inEl.value = '';
    inEl.placeholder = QS[i].hint;
    next.textContent = i === QS.length - 1 ? 'Open the page' : 'Next';
    saidEl.innerHTML = said.map((s, n) => '<div><b>' + QS[n].q + '</b> ' + s.replace(/[<&]/g, c => c === '<' ? '&lt;' : '&amp;') + '</div>').join('');
    setTimeout(() => inEl.focus(), 30);
  }
  function suggest() {
    const [who, want, stop] = said;
    if (!who || !want) return '';
    return who + ' wants ' + want + (stop ? ', but ' + stop : '') + '.';
  }
  async function finish(logline) {
    const line = (logline || '').trim();
    if (!line) { inEl.focus(); return; }
    if (!curPath) {
      // the table has no name yet — hold the line and let the first save place it
      pending = line;
      close();
      try { MAIRE.say('Good. Name it when you save, and the line goes with it.'); } catch (x) {}
      return;
    }
    loglinePut(curPath, line);   // the logline is kept on this machine
    close();
    try { MAIRE.say('There it is. Now write it.'); } catch (x) {}
  }
  function advance() {
    const v = inEl.value.trim();
    if (!v) { inEl.focus(); return; }
    if (i === QS.length - 1) { finish(v); return; }
    said[i] = v; i++;
    paint();
    if (i === QS.length - 1) { const s = suggest(); if (s) { inEl.value = s; inEl.select(); } }
  }
  function open() { live = true; el.hidden = false; i = 0; said = []; paint(); }
  function close() { live = false; el.hidden = true; }

  next.onclick = advance;
  skip.onclick = () => { i = QS.length - 1; paint(); };
  inEl.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); advance(); } };

  /** A table is NEW when it carries no logline yet — INCLUDING a table with no
   *  path at all, which is exactly what pressing New gives you. That was the
   *  bug: `New` sets curPath to null, and the first build bailed out on null
   *  instead of treating it as the newest table there is. A logline written
   *  before the file exists is held here and flushed by `flush()` the moment
   *  the script is first saved. */
  let pending = null;
  async function check() {
    if (!curPath) {
      const empty = !(getPlain() || '').trim();
      if (empty && !live) open(); else if (!empty) close();
      return;
    }
    // 2026-09-29: never veil work that exists — the four questions are for a blank page only
    if ((getPlain() || '').trim() || String(curPath).startsWith('vellum/')) { close(); return; }
    // the logline lives on this machine — a table is NEW while it carries none
    if (!loglineGet(curPath)) { if (!live) open(); } else close();
  }
  /** called after a save: a logline written before the file had a name lands now */
  async function flush() {
    if (!pending || !curPath) return;
    const line = pending; pending = null;
    loglinePut(curPath, line);
  }
  return { check, open, close, flush, hold(line) { pending = line; }, held() { return pending; } };
})();

(function () {

  if (!b || !pane || !fr || !menu) return;

  // RUNGS — the logline that opens into the summary that opens into the scenes

  // HIS RULING, 2026-09-16 (and the third time of asking): MAGIC IS THE THREE RUNGS.

  // no server — the constellation is the World tab (world.js, reading the page itself), so the

  function seat() { /* no magic.html on this glass */ }

  b.onclick = () => set(!menu.classList.contains('magic'));
  window.MAGIC_OPEN = set;
})();

  body.setting #path, body.setting .theme-dock, body.setting .maire-dock, body.setting .gear,
  body.setting .bgmark, body.setting .caret-sword, body.setting .tab { visibility: hidden; }
</style>
<script>
/* the cigarette and the scene, transplanted from the Inkling app through the old squatch room —
   the boxes are the very ones every inkling keeps: monomyth.focus.byok.v1, inkling.model,
   inkling.paid. A key kept here wakes Inkling too, and a Cha-ching here is law there.
   Only the test keeps a key; typing never does. */
(function () {
  function setSay(t, how) {
    var say = $('setSay'); if (!say) return;
    say.textContent = t || '';
    say.className = how === 'good' ? 'good' : (how === 'bad' ? 'bad' : '');
  }
  function grow(el) { if (!el) return; el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }
  function setDiag() {
    var el = $('setDiag'); if (!el) return;
    var b = setBox(), d = b.door || keyDoor(b.apiKey || ''), at = '';
    try { at = localStorage.getItem('inkling.keyAt') || ''; } catch (e) {}
    var lines = [];
    lines.push(d && b.apiKey ? ('key kept: ' + d + (at ? ' · since ' + at.slice(0, 10) : '')) : 'no key on this machine');
    lines.push('opened as ' + (matchMedia('(display-mode: standalone)').matches ? 'the Home Screen room' : 'a browser tab'));
    lines.push('this glass: ' + location.pathname);
    el.textContent = lines.join('\n');
  }
  function setFill() {
    var b = setBox(), d = b.door || keyDoor(b.apiKey || '');
    $('setKey').value = b.apiKey || '';
    grow($('setKey'));
    var kept = {};
    try { kept = JSON.parse(localStorage.getItem('inkling.model') || '{}') || {}; } catch (e) {}
    $('setModel').value = (d && kept[d]) || '';
    $('setChaRow').hidden = !d || paidOpen(d);
  }
  window.setOpen = function (why, how) {
    $('set').hidden = false;
    document.body.classList.add('setting');
    setFill(); setDiag(); setSay(why || '', how || '');
  };
  window.setClose = function () {
    $('set').hidden = true;
    document.body.classList.remove('setting');
  };
  var SET_BUSY = false;
  function setTest() {
    if (SET_BUSY) return;
    var v = ($('setKey').value || '').trim().replace(/\s+/g, '');
    if (!v) { setSay('Paste your key on the key line first.', 'bad'); return; }
    if (/^vck_/.test(v)) {   // the voiceless door's own stamp (JEV-INSTALL §4.8)
      try { var slot = JSON.parse(localStorage.getItem('monomyth.focus.decide.v1') || '{}') || {}; slot.key = v; slot.door = 'vercel';
        localStorage.setItem('monomyth.focus.decide.v1', JSON.stringify(slot)); } catch (e) {}
      $('setKey').value = ''; grow($('setKey'));
      setSay('The voiceless door has its key. The tape will ask it.', 'good');
      return;
    }
    SET_BUSY = true;
    var btn = $('setTest'), word = btn.textContent;
    btn.textContent = '…';
    setSay('Trying the doors…', '');
    var guess = keyDoor(v);
    var order = SET_TRY.slice();
    if (guess) order = [guess].concat(order.filter(function (d) { return d !== guess; }));
    var found = null, chain = Promise.resolve();
    order.forEach(function (d) {
      chain = chain.then(function () {
        if (found) return null;
        return fetchT(SET_LIST[d], { headers: doorHeaders(d, v) })
          .then(function (r) { if (r.ok) found = d; }, function () {});
      });
    });
    chain.then(function () {
      if (!found) { setSay('No door knew that key. The key line is unchanged.', 'bad'); return null; }
      var before = setBox();
      var swapped = before.apiKey && before.apiKey !== v;
      try {
        localStorage.setItem(SET_BOX, JSON.stringify({ apiKey: v, door: found }));
        localStorage.setItem('inkling.keyAt', new Date().toISOString());
      } catch (e) {}
      if (setBox().apiKey !== v) { setSay('This glass refused to keep the key. Try once more.', 'bad'); return null; }
      if (swapped) {
        try { var km = JSON.parse(localStorage.getItem('inkling.model') || '{}') || {}; delete km[found]; localStorage.setItem('inkling.model', JSON.stringify(km)); } catch (e) {}
      }
      setFill();
      if (found !== 'anthropic') {
        setSay('✓ ' + found + ' keeps the key. Squatch himself speaks through Anthropic — an sk-ant- key on this line wakes him.'
          + (found === 'groq' ? ' The ear hears with it.' : ''), 'good');
        return null;
      }
      if (!paidOpen('anthropic')) {
        setSay('That is an Anthropic key — Squatch’s own door, and it costs coin. Type Cha-ching on the coin line, then test again.', '');
        return null;
      }
      setSay('The coin is law. Waking Squatch…', '');
      return anthropicModel(v).then(function (m) {
        return mouth(v, [{ role: 'user', content: 'Squatch, can you hear me? Answer in one short line, in your voice.' }], m, '')
          .then(function (text) {
            setSay('✓ Works. anthropic · ' + m + '\nSquatch: ' + text, 'good');
            setTimeout(function () { setClose(); }, 2200);
          });
      }).catch(function (e) {
        setSay('The door took the key, but Squatch did not answer: ' + ((e && e.message) || 'silence.'), 'bad');
      });
    }).then(done, done);
    function done() { SET_BUSY = false; btn.textContent = word; setDiag(); }
  }
  $('setTest').addEventListener('click', setTest);
  $('setCha').addEventListener('change', function () {
    var w = $('setCha').value.trim().toLowerCase();
    $('setCha').value = '';
    if (!w) return;
    if (w !== 'cha-ching') { setSay('The word was not said.', 'bad'); return; }
    var b = setBox(), d = b.door || keyDoor(b.apiKey || '');
    try { var p = JSON.parse(localStorage.getItem('inkling.paid') || '{}') || {}; p[d || 'anthropic'] = true;
      localStorage.setItem('inkling.paid', JSON.stringify(p)); } catch (e) {}
    setFill();
    setSay('Cha-ching. The coin line is fed.', 'good');
  });
  $('setModel').addEventListener('change', function () {
    var b = setBox(), d = b.door || keyDoor(b.apiKey || '');
    if (!d) return;
    try { var km = JSON.parse(localStorage.getItem('inkling.model') || '{}') || {}; km[d] = $('setModel').value.trim();
      localStorage.setItem('inkling.model', JSON.stringify(km)); } catch (e) {}
    setSay('The model line is kept.', 'good');
  });
  $('setKey').addEventListener('input', function () { grow($('setKey')); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('set').hidden) setClose(); });

  /* the cigarette, cell for cell — the ember's sparks climb and come round */
  (function seatCig() {
    var cg = $('cig'); if (!cg) return;
    var CIG = ['ffgggggggggR', 'ffgggggggggR'], CPAL = { f: '#BF6A40', g: '#888888', R: '#FF0000' }, CS = 4, top = 5;
    var cx = cg.getContext('2d');
    cg.width = (CIG[0].length + 2) * CS; cg.height = (CIG.length + top) * CS;
    cg.style.width = cg.width + 'px'; cg.style.height = cg.height + 'px';
    var sp = 0;
    var cig = function () {
      cx.clearRect(0, 0, cg.width, cg.height);
      CIG.forEach(function (row, y) { Array.from(row).forEach(function (ch, i) {
        if (CPAL[ch]) { cx.fillStyle = CPAL[ch]; cx.fillRect(i * CS, (y + top) * CS, CS, CS); }
      }); });
      cx.fillStyle = '#FF0000';
      [[11, 4], [12, 2], [11, 0]].forEach(function (p) { var yy = (p[1] + top * 10 - sp) % top; cx.fillRect((p[0] + (yy % 2)) * CS, yy * CS, CS, CS); });
    };
    cig();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(function () { if (!cg.hidden) { sp = (sp + 1) % top; cig(); } }, 260);
    var tog = function () { if ($('set').hidden) setOpen(); else setClose(); };
    cg.addEventListener('click', tog);
    cg.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
  })();
})();
</script>
</body></html>
