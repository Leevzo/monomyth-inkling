<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Squatch">
<meta name="theme-color" content="#1a1a1a">
<title>Squatch</title>
<link rel="stylesheet" href="/fonts.css">
<link rel="apple-touch-icon" href="/squatch-icon.png">
<link rel="icon" type="image/png" href="/squatch-icon.png">
<link rel="manifest" href="/squatch.webmanifest">
<script>if (location.pathname.indexOf('/s/') === 0) document.documentElement.classList.add('guest');</script>
<!--
  SQUATCH — the writing inkling (the King, 2026-10-03).
  Inkling is the marketplace. This is one inkling: a script, a talk, a sky.
  Left: the script. Middle: the talk (last turn large, earlier turns zipped; pull down).
  Right: the constellation the page itself fills, and the story in order under it.
  Every pause of the pen, every line he says, every note, goes into an append-only log.
  The mouth is his own key's own door: this page calls Anthropic straight from the phone, and the key
  never leaves the box it shares with Inkling (monomyth.focus.byok.v1). The desk never sees it.
  The desk is a guest's seat on the house LAN: one scene, read only, and a note back.
  The ghost is the same seat for the wide world, with no Mac awake: a page-less desk that can read
  nothing. Packs and notes are sealed on this glass before they travel (AES-GCM; the key rides after
  the #, which no server ever sees). Notes back open only for the King's own word, held hashed.
  A key inside a sentence becomes [a key] before anything is written.
  Notes have no intelligence. A voice note is kept whole; it is not transcribed.
-->
<style>
  /* the ground speaks Scriptorium now (2026-10-03, his word): true grey chrome — R=G=B, never pure
     white or black — the 23's teal for content and state, hearth-gold only for the lit moment.
     Colour stays off the chrome and on the story: the wheel lives in the scene headings,
     the constellation, and the spine's word. */
  :root {
    --bg: #1a1a1a; --ink: #ededed; --dim: #949494; --faint: #666666;
    --line: #3a3a3a; --paper: #242424;
    --teal: #12ffc2; --teal-dim: #0dbf91; --gold: #ffa512; --red: #ff1239;
    --ghost: rgba(18, 255, 194, .34);
    --side-w: 280px;
    --pad: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, 'W95FA', monospace; -webkit-font-smoothing: none; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: baseline; gap: 10px 14px; padding: 10px var(--pad) 6px; flex: 0 0 auto; flex-wrap: wrap; }
  #title { font-family: ui-monospace, monospace; font-size: 17px; color: var(--ink);
    background: transparent; border: 0; padding: 0; flex: 1 1 100%; width: 100%; min-width: 0; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #count { color: var(--faint); font-size: 12px; }
  header button, #switch button, #note button, #say button {
    font-family: 'Dogica', ui-monospace, monospace; font-size: 11px; color: var(--dim);
    background: transparent; border: 0; padding: 6px 2px; cursor: pointer; }
  header button { color: var(--teal); }
  #switch { display: flex; gap: 16px; padding: 0 var(--pad) 8px; }
  #switch button.on { color: var(--ink); }
  #main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
  section { display: none; flex: 1 1 auto; min-height: 0; flex-direction: column; padding: 0 var(--pad) 10px; }
  section.on { display: flex; }
  #page { flex: 1 1 auto; min-height: 0; width: 100%; resize: none; border: 0; outline: none;
    background: transparent; color: var(--ink); caret-color: var(--teal);
    font-family: 'Courier New', Courier, monospace; font-size: 16px; line-height: 1.45; padding: 4px 0 12px; }
  #page::selection { background: rgba(18, 255, 194, .22); }
  #note { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; padding-top: 6px; }
  #note input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; font-size: 14px; padding: 6px 0; outline: none; }
  #hold.hot { color: #FF3D12; }
  #kept { color: var(--faint); font-size: 12px; min-height: 1.2em; padding: 4px 0 0; }
  #kept button { font-family: inherit; font-size: 12px; color: var(--teal); background: transparent; border: 0; padding: 0; cursor: pointer; }
  #talk { overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .zip { color: var(--faint); font-size: 13px; padding: 8px 0; }
  .chunk { color: var(--dim); font-size: 13px; padding: 3px 0 3px 10px; }
  #last { font-size: 22px; line-height: 1.35; padding: 18px 0 24px; white-space: pre-wrap; }
  #last .who { display: block; font-family: 'Dogica', ui-monospace, monospace; font-size: 11px; color: var(--teal); margin-bottom: 8px; }
  #say { display: flex; gap: 8px; align-items: center; flex: 0 0 auto; }
  #say input { flex: 1 1 auto; min-width: 0; background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; font-size: 16px; padding: 8px 0; outline: none; }
  #tools { overflow-y: auto; }
  #sky { min-height: 160px; aspect-ratio: 1.618 / 1; }
  #sky:empty { display: none; }
  .sky-facts { color: var(--dim); font-size: 13px; }
  .sky-facts .h { color: var(--ink); }
  #story { list-style: none; margin: 8px 0 0; padding: 0; }
  #story li { padding: 7px 8px 7px 12px; cursor: pointer; border-left: 3px solid var(--line); border-radius: 0 6px 6px 0; }
  #story li:hover { background: rgba(255, 255, 255, .035); }
  #story li.on { border-left-color: var(--teal); background: rgba(18, 255, 194, .05); }
  /* scene lines wear the serif, Scriptorium's hand for chapters and slugs */
  #story .h { font-size: 14px; font-family: Georgia, 'Times New Roman', serif; letter-spacing: .04em; }
  #story .b { color: var(--dim); font-size: 12px; white-space: pre-line; font-family: inherit; }
  #empty { color: var(--dim); padding: 12px 0; }
  #known { color: var(--dim); font-size: 13px; margin: 8px 0 0; }
  /* the wheel's front spot: his centre sits 44px in and 70px up from the lower right,
     the same corner he takes in the Inkling app. The drop into that app is this seat. */
  #sprite { position: fixed; z-index: 5; right: 9px; bottom: 5px; image-rendering: pixelated;
    background: transparent; pointer-events: none; }
  #cig { image-rendering: pixelated; cursor: pointer; background: transparent; flex: 0 0 auto; }
  #set { position: fixed; z-index: 30; top: 64px; right: 12px; width: min(320px, calc(100vw - 24px));
    max-height: calc(100vh - 80px); overflow: auto;
    background: var(--paper); color: var(--ink); padding: 12px 14px 14px;
    border: 1px solid var(--line); box-shadow: 4px 4px 0 rgba(0, 0, 0, .35); }
  #set[hidden] { display: none; }
  #set h2 { font-family: 'Dogica', ui-monospace, monospace; font-size: 12px; font-weight: normal; margin: 0 0 8px; }
  #set p, #set button { font-size: 13px; }
  #set button { font-family: 'Dogica', ui-monospace, monospace; font-size: 11px; color: var(--teal);
    background: transparent; border: 0; padding: 6px 0; cursor: pointer; display: block; }
  #setLink, #setHouse { color: var(--teal); word-break: break-all; }
  #setNotes { color: var(--dim); }
  #setHouse { font-size: 12px; }
  #key, #castcode, #ghost { background: transparent; border: 0; border-bottom: 1px solid var(--line);
    color: var(--ink); font: inherit; font-size: 14px; padding: 6px 0; outline: none; }
  #key, #ghost { width: 100%; }
  #castword { font-size: 22px; letter-spacing: 0.14em; color: var(--ink); }
  html.guest #talksec, html.guest #cig, html.guest #set, html.guest #anew, html.guest #share, html.guest #keep, html.guest #bring,
  html.guest #hold, html.guest #tape, html.guest #sprite, html.guest #cast, html.guest #castword, html.guest #castcode { display: none !important; }
  html.guest #switch button[data-screen="talk"] { display: none; }
  @media (max-width: 700px) {
    #note { flex-wrap: wrap; }
    #note input { flex: 1 1 100%; }
  }
  @media (max-width: 979px) {
    section { padding-bottom: 148px; }
  }
  @media (min-width: 980px) {
    #switch { display: none; }
    #title { flex: 0 1 auto; width: auto; font-family: 'Dogica', ui-monospace, monospace; font-size: 13px; letter-spacing: .06em; }
    #main { flex-direction: row; }
    html.guest #main section { width: 50%; }
    html.guest #spine { display: none !important; }
    /* the talk stays on the phone (his word): the desk holds the page and the side panel only */
    #talksec { display: none !important; }
    section { display: flex; width: 28%; }
    #scriptsec { flex: 1 1 auto; width: auto; min-width: 0; padding-right: 30px; padding-bottom: 140px; }
    #toolsec { width: var(--side-w); flex: 0 0 var(--side-w); padding: 0 18px 20px 18px; }
    /* his seat is left of the seam now, at the page's lower right, the same corner he keeps on the phone */
    #sprite { right: calc(var(--side-w) + 26px) !important; }
    #spine { display: block !important; }
  }
  /* ── the SQUATCH spine: the seam between the page and the side panel, as Scriptorium's —
     the word stands on its end, the ticks run above and below, and the drag resizes the panel.
     The word wears the wheel, one colour a beat; the lit moment (a hand on the seam) is gold. ── */
  #spine { display: none; position: fixed; top: 0; bottom: 0; right: var(--side-w); width: 30px; z-index: 6; cursor: ew-resize; touch-action: none; }
  #spine::before, #spine::after { content: ""; position: absolute; left: 50%; width: 1px; transform: translateX(-50%); background: var(--line); }
  #spine::before { top: 0; bottom: calc(50% + 110px); }
  #spine::after { top: calc(50% + 110px); bottom: 0; }
  #spine span { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%) rotate(180deg); writing-mode: vertical-rl;
    font-family: 'Dogica', ui-monospace, monospace; font-size: 12px; letter-spacing: .32em; color: var(--dim);
    user-select: none; -webkit-user-select: none; transition: color .25s; }
  #spine:hover span, #spine.dragging span { color: var(--ink); text-shadow: 0 0 8px rgba(255, 165, 18, .55); }
  #spine:hover::before, #spine:hover::after, #spine.dragging::before, #spine.dragging::after { background: var(--gold); }
  #spine.dragging { cursor: grabbing; }
</style>
</head>
<body>
<header>
  <input id="title" aria-label="The name of this project" placeholder="Name this project" spellcheck="false" autocomplete="off">
  <span id="count"></span>
  <button type="button" id="anew">new</button>
  <button type="button" id="cast">cast</button>
  <span id="castword" hidden></span>
  <input id="castcode" hidden aria-label="The word on the computer" placeholder="the word on the computer" autocomplete="off" autocapitalize="characters" spellcheck="false">
  <button type="button" id="share">share</button>
  <button type="button" id="keep">copy</button>
  <button type="button" id="bring">open</button>
  <canvas id="cig" role="button" tabindex="0" aria-label="settings, the cigarette"></canvas>
  <input id="file" type="file" accept="application/json,.json,.inkling" hidden>
  <input id="voicetape" type="file" accept="audio/*,.m4a,.mp3,.webm,.wav,.ogg,.txt,.fountain,.md" hidden>
</header>
<nav id="switch">
  <button type="button" data-screen="script" class="on">script</button>
  <button type="button" data-screen="talk">talk</button>
  <button type="button" data-screen="tools">sky</button>
</nav>
<div id="main">
  <section id="scriptsec" class="on" data-name="script">
    <textarea id="page" spellcheck="true" aria-label="The script" placeholder="INT.  — name the place. Then a person, in capitals, and they step into the sky."></textarea>
    <div id="note">
      <input id="noteline" aria-label="A note, kept for you, with no one else reading it" placeholder="A note for you. Tap a scene to pin it." autocomplete="off">
      <button type="button" id="sendnote">to me</button>
      <button type="button" id="hold">hold</button>
      <button type="button" id="tape">tape</button>
    </div>
    <div id="kept"></div>
  </section>
  <section id="talksec" data-name="talk">
    <div id="talk"></div>
    <form id="say">
      <input id="line" aria-label="Say it to Squatch" placeholder="The council's mouth is shut. Your words are kept." autocomplete="off">
      <button type="submit">say</button>
    </form>
  </section>
  <section id="toolsec" data-name="tools">
    <div id="sky" aria-label="The constellation of this script"></div>
    <p id="empty">Write a scene. The stars come out of the page.</p>
    <p id="known" hidden></p>
    <ol id="story"></ol>
  </section>
</div>
<canvas id="sprite" aria-label="Squatch"></canvas>
<div id="spine" title="drag: the side panel's width"><span id="spineword">SQUATCH</span></div>
<div id="set" hidden role="dialog" aria-label="settings">
  <h2>the cigarette</h2>
  <div id="setProjects"></div>
  <input id="key" type="password" aria-label="Your key, on this phone" placeholder="Your key, on this phone" autocomplete="off" spellcheck="false">
  <input id="ghost" aria-label="The ghost's address" placeholder="The ghost's address — https://….workers.dev (the wide-world seat)" autocomplete="off" spellcheck="false">
  <p id="setHouse"></p>
  <button type="button" id="setScene">share this scene</button>
  <button type="button" id="setFollow">share whichever scene I have open</button>
  <p id="setLink"></p>
  <div id="setNotes"></div>
</div>
<script src="/squatch-room.js"></script>
<script src="/sky.js"></script>
<script>
(function () {
  'use strict';
  var R = window.SquatchRoom, DRAWER = 'squatch.room.v1';
  var shelf, state, timer = 0, screen = 'script';
  var $ = function (id) { return document.getElementById(id); };

  function loadShelf() {
    try {
      var raw = localStorage.getItem(DRAWER);
      if (raw) { var s = R.shelfFrom(JSON.parse(raw)); if (s) return s; }
    } catch (e) {}
    return R.freshShelf(Date.now());
  }
  function currentOf(s) {
    var i, p = s.projects[0];
    for (i = 0; i < s.projects.length; i++) if (s.projects[i].id === s.current) p = s.projects[i];
    s.current = p.id;
    return p;
  }
  var kingKey = '', shares = {}, noteSince = 0, guest = location.pathname.indexOf('/s/') === 0 ? location.pathname.slice(3) : '';
  var gkey = location.hash ? decodeURIComponent(location.hash.slice(1)) : '';
  var ghost = '', ghostShares = {}, ghostRev = -1;
  var glass = null, castCode = '', castSending = false, castReceiving = false, castRev = -1, castTimer = 0;
  var house = '', deskReady = false, wantCast = false, hearing = false;
  function save() {
    if (guest || glass) return;
    R.remember(shelf, state);
    try { localStorage.setItem(DRAWER, JSON.stringify(R.packShelf(shelf))); }
    catch (e) { $('kept').textContent = 'This phone is full. Keep a copy before you write more.'; }
    publish();
    if (castSending) pushShow();
  }
  function now() { return Date.now(); }

  function show(name) {
    screen = name;
    Array.prototype.forEach.call(document.querySelectorAll('section'), function (s) {
      s.classList.toggle('on', s.getAttribute('data-name') === name);
    });
    Array.prototype.forEach.call(document.querySelectorAll('#switch button'), function (b) {
      b.classList.toggle('on', b.getAttribute('data-screen') === name);
    });
  }

  function paintTalk() {
    var talk = $('talk'), chat = state.chat, last = chat[chat.length - 1], older = chat.slice(0, -1);
    talk.textContent = '';
    if (older.length) {
      var z = document.createElement('div');
      z.className = 'zip';
      z.textContent = state.open ? 'zip them back up' : 'pull down — ' + older.length + (older.length === 1 ? ' earlier turn' : ' earlier turns');
      z.tabIndex = 0;
      z.addEventListener('click', function () { state.open = !state.open; save(); paintTalk(); });
      talk.appendChild(z);
      if (state.open) older.forEach(function (m) {
        var p = document.createElement('p');
        p.className = 'chunk';
        p.textContent = (m.who === 'king' ? 'You. ' : 'Squatch. ') + R.chunk(m.text);
        p.title = m.text;
        talk.appendChild(p);
      });
    }
    if (last) {
      var big = document.createElement('div');
      big.id = 'last';
      var who = document.createElement('span');
      who.className = 'who';
      who.textContent = last.who === 'king' ? 'You' : 'Squatch';
      big.appendChild(who);
      big.appendChild(document.createTextNode(last.text));
      talk.appendChild(big);
    }
  }

  function paintSky(parsed) {
    var host = $('sky'), empty = $('empty');
    if (!parsed.people.length && !parsed.places.length) {
      host.textContent = ''; host._sky = null;
      empty.hidden = false;
      return;
    }
    empty.hidden = true;
    if (window.SKY && SKY.draw) SKY.draw(host, R.skyFrom(pageScript(), pageTitle()));
  }

  function paintStory(parsed) {
    var ol = $('story');
    ol.textContent = '';
    var noteKey = pageScene();
    $('noteline').placeholder = noteKey && noteKey !== '*'
      ? 'A note on this scene. Kept here. Not read by anyone.'
      : 'A note for you. Tap a scene to pin it.';
    parsed.scenes.forEach(function (sc) {
      var key = R.sceneKey(sc);
      var li = document.createElement('li');
      if (key === pageScene()) li.className = 'on';
      li.style.borderLeftColor = R.colourOf(sc.place);
      var h = document.createElement('div');
      h.className = 'h';
      h.style.color = R.textOf(sc.place);
      h.textContent = sc.heading;
      var b = document.createElement('div');
      b.className = 'b';
      var beats = (R.plotOf(pageScript()) || []).filter(function (p) { return p.heading === sc.heading; });
      b.textContent = beats.length
        ? beats.map(function (p) { return (p.who ? p.who + ' — ' : '') + p.text; }).join('\n')
        : sc.people.join(', ') + (sc.beat ? ' — ' + sc.beat : '');
      li.appendChild(h); li.appendChild(b);
      li.addEventListener('click', function () {
        if (glass) return;
        state.scene = state.scene === key ? null : key;
        if (state.scene) {
          var lines = state.script.split('\n');
          var pos = lines.slice(0, sc.line).join('\n').length;
          var ta = $('page');
          ta.focus();
          ta.setSelectionRange(pos, pos);
          var lh = parseFloat(getComputedStyle(ta).lineHeight) || 24;
          ta.scrollTop = sc.line * lh;
        }
        save(); paint();
      });
      ol.appendChild(li);
    });
    if (glass) { $('kept').textContent = 'From the phone.'; return; }
    var notes = (state.notes[noteKey || '*'] || []).slice(-3);
    var orphans = Object.keys(state.notes).filter(function (k) {
      if (k === '*') return false;
      return !parsed.scenes.some(function (sc) { return R.sceneKey(sc) === k; });
    });
    var keptEl = $('kept');
    keptEl.textContent = '';
    notes.forEach(function (n, i) {
      var el;
      if (n.voice) {
        el = document.createElement('button');
        el.type = 'button';
        el.textContent = '▶ ' + (n.name || 'a voice note');
        el.addEventListener('click', function () { playVoice(n.voice, n.name); });
      } else {
        el = document.createElement('span');
        el.textContent = n.text;
      }
      keptEl.appendChild(el);
      if (i < notes.length - 1) keptEl.appendChild(document.createTextNode('  ·  '));
    });
    if (orphans.length) keptEl.appendChild(document.createTextNode((notes.length ? '  ·  ' : '') + orphans.length + ' note' + (orphans.length === 1 ? '' : 's') + ' kept from a scene whose heading changed'));
  }

  function pageScript() { return glass ? glass.script : state.script; }
  function pageTitle() { return glass ? glass.title : state.title; }
  function pageScene() { return glass ? glass.scene : state.scene; }
  function paint() {
    var script = pageScript(), title = pageTitle();
    var parsed = R.parse(script);
    var words = script.trim() ? script.trim().split(/\s+/).length : 0;
    $('count').textContent = words + (words === 1 ? ' word' : ' words') + ' · ' + parsed.scenes.length + (parsed.scenes.length === 1 ? ' scene' : ' scenes');
    $('page').readOnly = !!glass;
    $('title').readOnly = !!glass;
    if (document.activeElement !== $('title') && $('title').value !== title) $('title').value = title;
    if (document.activeElement !== $('page') && $('page').value !== script) $('page').value = script;
    if (!glass) paintTalk();
    paintSky(parsed);
    paintStory(parsed);
    paintKnown();
    paintProjects();
  }
  function paintKnown() {
    var el = $('known');
    if (!el) return;
    var names = shelf && shelf.people ? Object.keys(shelf.people) : [];
    el.textContent = '';
    if (!names.length) { el.hidden = true; return; }
    el.hidden = false;
    el.appendChild(document.createTextNode('Known, in every project. '));
    names.forEach(function (n, i) {
      var s = document.createElement('span');
      s.style.color = R.textOf(n);
      s.textContent = n + (i < names.length - 1 ? ' · ' : '');
      el.appendChild(s);
    });
  }
  function paintProjects() {
    var box = $('setProjects');
    if (!box || !shelf) return;
    box.textContent = '';
    shelf.projects.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = p.title || 'Untitled';
      if (p.id === state.id) b.style.color = 'var(--ink)';
      b.addEventListener('click', function () { openProject(p.id); });
      box.appendChild(b);
    });
  }
  function openProject(id) {
    if (glass || !shelf || state.id === id) return;
    var p = null, i;
    for (i = 0; i < shelf.projects.length; i++) if (shelf.projects[i].id === id) p = shelf.projects[i];
    if (!p) return;
    shelf.current = p.id;
    state = p;
    $('page').value = state.script;
    $('title').value = state.title;
    save();
    paint();
  }
  function newProject() {
    if (glass) return;
    var p = R.project(now(), '');
    shelf.projects.push(p);
    openProject(p.id);
    $('title').focus();
  }

  function onPage() {
    if (glass) return;
    clearTimeout(timer);
    timer = setTimeout(function () {
      if (R.applyScript(state, $('page').value, now())) { save(); paint(); }
    }, 400);
  }

  $('page').addEventListener('input', onPage);
  $('title').addEventListener('change', function () {
    if (glass) return;
    var t = $('title').value.trim();
    if (!t || t === state.title) return;
    state.log.push({ t: now(), kind: 'title', text: t, was: state.title });
    state.title = t; save(); paint();
  });

  document.getElementById('switch').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return; show(b.getAttribute('data-screen'));
  });

  var py = 0;

      navigator.clipboard.writeText(text).then(function () { $('kept').textContent = 'The script is copied. The notes stayed here.'; });
    }
  }

  function download(name, blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
  }
  $('keep').addEventListener('click', function () {
    var pack = R.packShelf(shelf);
    var built = replayOk();
    pack.replay = built;
    state.log.push({ t: now(), kind: 'keep' });
    save();
    var safe = state.title.replace(/[^\w]+/g, ' ').trim() || 'Squatch';
    download(safe + '.inkling.json', new Blob([JSON.stringify(pack, null, 2)], { type: 'application/json' }));
  });
  function replayOk() {
    var back = R.replay(state.log, '');
    return back === state.script;
  }
  $('bring').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function () {
    var f = $('file').files && $('file').files[0]; $('file').value = ''; if (!f) return;
    var reader = new FileReader();
    reader.onload = function () {
      try {
        var brought = R.takeIn(shelf, JSON.parse(String(reader.result)));
        if (!brought) { $('kept').textContent = 'That file is not a Squatch copy.'; return; }
        state = currentOf(shelf);
        $('page').value = state.script;
        $('title').value = state.title;
        state.log.push({ t: now(), kind: 'brought', added: brought.added.length });
        save(); paint();
        $('kept').textContent = brought.added.length
          ? 'That copy is its own project. The people already known stayed.'
          : 'Those projects were already here. The people stayed.';
      } catch (e) { $('kept').textContent = 'That file would not open.'; }
    };
    reader.readAsText(f);
  });

  function publish() {
    if (ghost && !guest) ghostPublish();
    if (!kingKey || guest) return;
    Object.keys(shares).forEach(function (token) {
      var rec = shares[token];
      if (!rec || rec.project !== state.id) return;
      var key = rec.mode === 'follow' ? state.scene : rec.mode;
      var pack = R.scenePack(state.script, state.title, key);
      if (!pack.scene) return;
      fetch('/api/share', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Squatch-Desk': kingKey },
        body: JSON.stringify({ token: token, mode: rec.mode === 'follow' ? 'follow' : 'scene', pack: pack }) })
        .catch(function () {});
    });
  }
  function share(mode) {
    if (ghost) return ghostShare(mode);
    if (!kingKey) { $('setLink').textContent = 'No seat is awake: give the ghost its address below, or open Squatch at the desk on the Mac.'; return; }
    if (mode === 'scene' && !state.scene) { $('setLink').textContent = 'Select a scene in the story first.'; return; }
    var pack = R.scenePack(state.script, state.title, mode === 'follow' ? state.scene : state.scene);
    if (!pack.scene) { $('setLink').textContent = 'The page has no scene yet.'; return; }
    fetch('/api/share', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Squatch-Desk': kingKey },
      body: JSON.stringify({ mode: mode, pack: pack }) })
      .then(function (r) { return r.json(); })
      .then(function (o) {
        if (!o.url) { $('setLink').textContent = 'The house did not take it.'; return; }
        shares[o.token] = { project: state.id, mode: mode === 'follow' ? 'follow' : pack.scene.key };
        try { localStorage.setItem('squatch.room.shares', JSON.stringify(shares)); } catch (e) {}
        $('setLink').textContent = o.url;
        state.log.push({ t: now(), kind: 'share', chars: (pack.scene.text || '').length, scene: pack.scene.key, mode: mode });
        save();
      }).catch(function () { $('setLink').textContent = 'The house cannot hear the desk.'; });
  }
  function takeNotes() {
    if (!kingKey || guest) return;
    fetch('/api/notes?since=' + noteSince, { headers: { 'X-Squatch-Desk': kingKey } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        if (!o || !o.notes || !o.notes.length) return;
        o.notes.forEach(function (n) {
          noteSince = Math.max(noteSince, n.id || 0);
          var key = n.scene || '*';
          if (!state.notes[key]) state.notes[key] = [];
          state.notes[key].push({ id: 'g' + n.id, at: n.at, text: (n.name || 'a guest') + ': ' + n.text });
          state.log.push({ t: now(), kind: 'note', scene: key, text: n.text, who: n.name || 'a guest' });
        });
        var last = o.notes[o.notes.length - 1];
        $('kept').textContent = (last.name || 'a guest') + ' sent a note.';
        var box = $('setNotes');
        if (box) box.textContent = o.notes.map(function (n) { return (n.name || 'a guest') + ': ' + n.text; }).join('\n');
        save();
      }).catch(function () {});
  }
  function applyPack(pack) {
    if (!pack || !pack.scene) return;
    state.title = pack.title || state.title;
    state.script = pack.scene.text || '';
    state.scene = pack.scene.key;
    $('page').value = state.script;
    $('page').readOnly = true;
    var ol = $('story');
    ol.textContent = '';
    (pack.story || []).forEach(function (sc) {
      var li = document.createElement('li');
      if (sc.open) li.className = 'on';
      li.style.borderLeftColor = R.colourOf(sc.place || sc.heading);
      var h = document.createElement('div');
      h.className = 'h'; h.style.color = R.textOf(sc.place || sc.heading); h.textContent = sc.heading;
      var b = document.createElement('div');
      b.className = 'b';
      b.textContent = sc.open ? (sc.people || []).join(', ') + (sc.beat ? ' — ' + sc.beat : '') : 'another part';
      li.appendChild(h); li.appendChild(b);
      ol.appendChild(li);
    });
    $('empty').hidden = true;
    if (window.SKY && pack.sky) SKY.draw($('sky'), pack.sky);
    var words = state.script.trim() ? state.script.trim().split(/\s+/).length : 0;
    $('count').textContent = words + (words === 1 ? ' word' : ' words') + ' · this scene';
    if ($('title').value !== state.title) $('title').value = state.title;
    $('title').readOnly = true;
  }
  /* a ghost guest: the seat's ciphertext is opened on this glass with the key that rode after the # */
  function ghostPull() {
    fetch('/api/seat?id=' + encodeURIComponent(guest)).then(function (r) { return r.ok ? r.json() : null; }).then(function (o) {
      if (!o || !o.data || o.rev === ghostRev) return;
      ghostRev = o.rev;
      gOpen(gkey, o.data).then(function (pack) { if (pack) applyPack(pack); });
    }).catch(function () {});
  }
  function ghostSendBack(name, text, input) {
    gSeal(gkey, { name: name, text: text, scene: state.scene || '' }).then(function (data) {
      return fetch('/api/seat/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: guest, data: data }) });
    }).then(function (r) {
      if (!r.ok) { $('kept').textContent = 'The note did not go.'; return; }
      input.value = '';
      $('kept').textContent = 'Sealed and sent back to him.';
    }).catch(function () { $('kept').textContent = 'The note did not go.'; });
  }
  function pull() {
    if (gkey) return ghostPull();
    fetch('/api/s/' + guest).then(function (r) { return r.ok ? r.json() : null; }).then(function (o) {
      if (o && o.pack) applyPack(o.pack);
    }).catch(function () {});
  }
  function sendBack() {
    var input = $('noteline'), name = sessionStorage.getItem('squatch.guest') || '';
    if (!name) {
      name = window.prompt('Your name, so he knows who sent it.') || '';
      name = name.trim().slice(0, 40);
      if (!name) return;
      sessionStorage.setItem('squatch.guest', name);
    }
    var text = input.value.trim();
    if (!text) return;
    if (gkey) return ghostSendBack(name, text, input);
    fetch('/api/s/' + guest + '/note', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: text, name: name }) })
      .then(function (r) {
        if (!r.ok) { $('kept').textContent = 'The note did not go.'; return; }
        input.value = '';
        $('kept').textContent = 'Sent back to him.';
      }).catch(function () { $('kept').textContent = 'The note did not go.'; });
  }

  /* his body, cell for cell, from squatch.json. The red pixels above the ember climb and come round. Never redrawn. */
  function seatSquatch() {
    var cv = $('sprite'); if (!cv || guest) return;
    fetch('/squatch/squatch.json').then(function (r) { return r.json(); }).then(function (O) {
      var S = 5, w = O.w, h = O.h, rows = O.frames[0], ey = 10, cols = [9, 10];
      var isSpark = function (x, y) { return y < ey && cols.indexOf(x) >= 0 && O.pal[rows[y][x]] && String(O.pal[rows[y][x]]).toUpperCase() === '#FF0000'; };
      var sparks = [];
      rows.forEach(function (r, y) { Array.from(r).forEach(function (ch, x) { if (isSpark(x, y)) sparks.push({ x: x, y: y, c: O.pal[ch] }); }); });
      cv.width = w * S; cv.height = h * S; cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px';
      cv.style.right = 'max(' + (44 - w * S / 2) + 'px, env(safe-area-inset-right))';
      cv.style.bottom = 'max(' + (70 - h * S / 2) + 'px, env(safe-area-inset-bottom))';
      var ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
      var body = function () {
        rows.forEach(function (r, y) { Array.from(r).forEach(function (ch, x) {
          var c = O.pal[ch]; if (!c || isSpark(x, y)) return; ctx.fillStyle = c; ctx.fillRect(x * S, y * S, S, S);
        }); });
      };
      var draw = function () {
        ctx.clearRect(0, 0, cv.width, cv.height); body();
        sparks.forEach(function (s) { if (s.y >= 0) { ctx.fillStyle = s.c; ctx.fillRect(s.x * S, s.y * S, S, S); } });
      };
      draw();
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      setInterval(function () { sparks.forEach(function (s) { s.y -= 1; if (s.y < 0) s.y = ey - 1; }); draw(); }, 240);
    }).catch(function () {});
  }
  function seatCig() {
    var cg = $('cig'); if (!cg) return;
    var CIG = ['ffgggggggggR', 'ffgggggggggR'], CPAL = { f: '#BF6A40', g: '#888888', R: '#FF0000' }, CS = 4, top = 5;
    var cx = cg.getContext('2d');
    cg.width = (CIG[0].length + 2) * CS; cg.height = (CIG.length + top) * CS;
    cg.style.width = cg.width + 'px'; cg.style.height = cg.height + 'px';
    var sp = 0;
    var cig = function () {
      cx.clearRect(0, 0, cg.width, cg.height);
      CIG.forEach(function (row, y) { Array.from(row).forEach(function (ch, i) {
        if (CPAL[ch]) { cx.fillStyle = CPAL[ch]; cx.fillRect(i * CS, (y + top) * CS, CS, CS); }
      }); });
      cx.fillStyle = '#FF0000';
      [[11, 4], [12, 2], [11, 0]].forEach(function (p) { var yy = (p[1] + top * 10 - sp) % top; cx.fillRect((p[0] + (yy % 2)) * CS, yy * CS, CS, CS); });
    };
    cig();
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) setInterval(function () { if (!cg.hidden) { sp = (sp + 1) % top; cig(); } }, 260);
    var tog = function () { $('set').hidden = !$('set').hidden; };
    cg.addEventListener('click', tog);
    cg.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
  }

  /* the SQUATCH spine: drag the seam, the side panel follows; the width is kept in this drawer.
     The word wears the wheel one colour a beat — the bead-pattern's twelve, climbing like the ember —
     and goes quiet-gold while a hand is on the seam. */
  (function () {
    try { var sw = localStorage.getItem('squatch.room.sidew'); if (sw) document.documentElement.style.setProperty('--side-w', sw); } catch (e) {}
    var sp = $('spine'), word = $('spineword'), dragging = false, ci = 0;
    if (word && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
      setInterval(function () {
        if (dragging || !word) return;
        ci = (ci + 1) % R.WHEEL.length;
        word.style.color = R.WHEEL[ci];
      }, 900);
    }
    if (!sp) return;
    sp.addEventListener('pointerdown', function (e) {
      dragging = true;
      sp.classList.add('dragging');
      document.body.style.userSelect = 'none';
      try { sp.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    });
    sp.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var w = Math.max(200, Math.min(520, window.innerWidth - e.clientX - 15));
      document.documentElement.style.setProperty('--side-w', w + 'px');
    });
    var drop = function () {
      if (!dragging) return;
      dragging = false;
      sp.classList.remove('dragging');
      document.body.style.userSelect = '';
      try { localStorage.setItem('squatch.room.sidew', getComputedStyle(document.documentElement).getPropertyValue('--side-w')); } catch (e) {}
    };
    sp.addEventListener('pointerup', drop);
    sp.addEventListener('pointercancel', drop);
  })();

  function showCode(code) {
    $('castword').hidden = false;
    $('castword').textContent = String(code || '').split('').join(' ');
    $('cast').textContent = 'stop';
    var url = (house || '') + '/squatch.html';
    $('kept').textContent = url ? ('On the phone, open ' + url + ' and cast this word.') : 'On the phone, cast this word.';
    if ($('setHouse') && house) $('setHouse').textContent = url;
  }
  function pushShow() {
    if (!castSending || !castCode || glass) return;
    fetch('/api/cast/show', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ code: castCode, title: state.title, script: state.script, scene: state.scene || '' }) })
      .then(function (r) {
        if (r.status === 404 || r.status === 429) {
          castSending = false;
          $('cast').textContent = 'cast';
          $('castcode').hidden = true;
          try { sessionStorage.removeItem('squatch.cast.code'); } catch (e) {}
          $('kept').textContent = r.status === 429 ? 'The computer is ignoring guesses. Wait.' : 'The computer is not waiting for that word.';
        }
      }).catch(function () { $('kept').textContent = 'The computer cannot hear this phone.'; });
  }
  function beginSend() {
    var c = $('castcode').value.replace(/\s+/g, '').toUpperCase();
    if (c.length < 4) { $('castcode').hidden = false; $('castcode').focus(); return; }
    castCode = c;
    castSending = true;
    try { sessionStorage.setItem('squatch.cast.code', c); } catch (e) {}
    $('castcode').hidden = true;
    $('cast').textContent = 'stop';
    $('kept').textContent = 'Casting this page.';
    pushShow();
    if (!castTimer) castTimer = setInterval(pushShow, 2000);
  }
  function stopSend() {
    castSending = false;
    castCode = '';
    if (castTimer) { clearInterval(castTimer); castTimer = 0; }
    try { sessionStorage.removeItem('squatch.cast.code'); } catch (e) {}
    $('cast').textContent = 'cast';
    $('castcode').hidden = true;
    $('kept').textContent = 'The cast stopped.';
  }
  function resumeSend() {
    var c = '';
    try { c = sessionStorage.getItem('squatch.cast.code') || ''; } catch (e) {}
    if (!c || kingKey) return;
    castCode = c;
    castSending = true;
    $('cast').textContent = 'stop';
    pushShow();
    if (!castTimer) castTimer = setInterval(pushShow, 2000);
  }
  function pullCast() {
    if (!castReceiving || !kingKey) return;
    fetch('/api/cast', { headers: { 'X-Squatch-Desk': kingKey } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        if (!o || !o.shown || o.rev === castRev) return;
        castRev = o.rev;
        glass = { title: o.title || '', script: o.script || '', scene: o.scene || null };
        paint();
      }).catch(function () {});
  }
  function startReceive() {
    fetch('/api/cast', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Squatch-Desk': kingKey }, body: '{}' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        if (!o || !o.code) { $('kept').textContent = 'This glass cannot receive.'; return; }
        castReceiving = true;
        castRev = -1;
        glass = null;
        showCode(o.code);
        if (!castTimer) castTimer = setInterval(pullCast, 1000);
      }).catch(function () { $('kept').textContent = 'This glass cannot receive.'; });
  }
  function stopReceive() {
    fetch('/api/cast', { method: 'DELETE', headers: { 'X-Squatch-Desk': kingKey } }).catch(function () {});
    castReceiving = false;
    glass = null;
    castRev = -1;
    if (castTimer) { clearInterval(castTimer); castTimer = 0; }
    $('castword').hidden = true;
    $('castword').textContent = '';
    $('cast').textContent = 'cast';
    $('page').readOnly = false;
    $('title').readOnly = false;
    paint();
  }
  function resumeCast() {
    fetch('/api/cast', { headers: { 'X-Squatch-Desk': kingKey } })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (o) {
        if (!o || !o.code) return;
        castReceiving = true;
        showCode(o.code);
        if (o.shown) {
          castRev = o.rev;
          glass = { title: o.title || '', script: o.script || '', scene: o.scene || null };
          paint();
        }
        if (!castTimer) castTimer = setInterval(pullCast, 1000);
      }).catch(function () {});
  }
  function onCast() {
    if (!deskReady) { wantCast = true; return; }
    if (castReceiving) { stopReceive(); return; }
    if (castSending) { stopSend(); return; }
    if (kingKey) { startReceive(); return; }
    if (!$('castcode').hidden && $('castcode').value.trim()) { beginSend(); return; }
    $('castcode').hidden = false;
    $('castcode').focus();
  }

  if (guest) {
    state = R.blank(Date.now());
    state.script = ''; state.chat = [];
    $('page').readOnly = true;
    $('sendnote').textContent = 'send back';
    $('noteline').placeholder = 'A note on this scene. It goes back to him.';
    $('sendnote').addEventListener('click', sendBack);
    show('script');
    pull();
    setInterval(pull, 1500);
  } else {
    shelf = loadShelf();
    state = currentOf(shelf);
    try { shares = JSON.parse(localStorage.getItem('squatch.room.shares') || '{}') || {}; } catch (e) { shares = {}; }
    try { ghost = (localStorage.getItem('squatch.room.ghost') || '').trim().replace(/\/+$/, ''); } catch (e) {}
    try { ghostShares = JSON.parse(localStorage.getItem('squatch.room.ghostshares') || '{}') || {}; } catch (e) { ghostShares = {}; }
    if (ghost) $('ghost').value = ghost;
    setInterval(ghostNotes, 2000);
    Object.keys(shares).forEach(function (token) {
      if (typeof shares[token] === 'string') shares[token] = { project: shelf.projects[0].id, mode: shares[token] };
    });
    $('anew').addEventListener('click', newProject);
    fetch('/squatch/session.txt').then(function (r) { return r.ok ? r.text() : ''; }).then(function (t) {
      if (!t || !t.trim() || !shelf) return;
      var built = R.construct(t), kept = [], i, p, notes, k, kingSaid;
      for (i = 0; i < shelf.projects.length; i++) {
        p = shelf.projects[i];
        kingSaid = (p.chat || []).some(function (m) { return m.who === 'king'; });
        notes = false;
        for (k in (p.notes || {})) if ((p.notes[k] || []).length) notes = true;
        if (p.script === built.script && !kingSaid && !notes) continue;
        kept.push(p);
      }
      if (kept.length === shelf.projects.length) return;
      if (!kept.length) {
        shelf = R.freshShelf(now());
        state = currentOf(shelf);
        state.log.push({ t: now(), kind: 'cleared', what: 'session test' });
      } else {
        shelf.projects = kept;
        if (!kept.some(function (q) { return q.id === shelf.current; })) shelf.current = kept[0].id;
        state = currentOf(shelf);
      }
      $('page').value = state.script;
      $('title').value = state.title;
      save(); paint();
    }).catch(function () {});
    if ($('page').value !== state.script) $('page').value = state.script;
    show('script');
    paint();
    $('page').focus();
    seatSquatch();
    seatCig();
    $('setScene').addEventListener('click', function () { share('scene'); });
    $('setFollow').addEventListener('click', function () { share('follow'); });
    try { $('key').value = phoneKey(); } catch (e) {}
    if (phoneKey()) $('line').placeholder = 'Say it to Squatch.';
    $('key').addEventListener('change', function () {
      var v = scrub($('key').value.trim());
      try {
        var b = JSON.parse(localStorage.getItem('monomyth.focus.byok.v1') || '{}') || {};
        if (v) b.apiKey = v; else delete b.apiKey;
        localStorage.setItem('monomyth.focus.byok.v1', JSON.stringify(b));
        localStorage.removeItem('squatch.room.key');
      } catch (e) {}
      $('line').placeholder = v ? 'Say it to Squatch.' : "The council's mouth is shut. Your words are kept.";
      $('kept').textContent = v ? 'The key is in the box this phone shares with Inkling.' : 'No key on this phone.';
    });
    $('ghost').addEventListener('change', function () {
      var v = $('ghost').value.trim().replace(/\/+$/, '');
      if (v && v.indexOf('http') !== 0) v = 'https://' + v;
      ghost = v;
      try { localStorage.setItem('squatch.room.ghost', ghost); } catch (e) {}
      $('kept').textContent = ghost ? 'The ghost has an address.' : 'The ghost was let go.';
    });
    $('cast').addEventListener('click', onCast);
    $('castcode').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); beginSend(); }
    });
    fetch('/api/info').then(function (r) { return r.ok ? r.json() : null; }).then(function (o) {
      if (o && o.shareBase) {
        house = o.shareBase;
        if ($('setHouse')) $('setHouse').textContent = house + '/squatch.html';
      }
    }).catch(function () {});
    fetch('/api/desk-key').then(function (r) { return r.ok ? r.json() : null; }).then(function (o) {
      if (o && o.key) { kingKey = o.key; publish(); setInterval(takeNotes, 2000); resumeCast(); }
      deskReady = true;
      if (wantCast) { wantCast = false; onCast(); }
      else if (!kingKey) resumeSend();
    }).catch(function () { deskReady = true; });
  }
})();
</script>
