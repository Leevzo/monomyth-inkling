<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#454545">
<title>Read the Crown</title>
<link rel="stylesheet" href="./fonts.css">
<script>window.INK_V = '1791152563';</script>
<script src="./share.js?v=1791152563"></script>
<!--
  THE MAC'S EYE (a reader's idea, 2026-10-02: "the crown code as a protocol, not a button"). Open this page on Neverland, hold the
  phone's crown (double-tap it in Inkling) up to the Mac's camera a hand-span away, and the kingdom it carries is kept as a
  .inkling file in Downloads: a copy off the phone, with no wire, no server and nothing on the web. The camera's pictures never
  leave this Mac; this page stores nothing.
-->
<style>
  :root { --ground: #454545; --ink: #f2f2f2; --dim: #b4b4b4; --gold: #FFA512; }
  html, body { margin: 0; height: 100%; background: var(--ground); color: var(--ink); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; box-sizing: border-box; text-align: center;
    font-family: 'W95FA', ui-monospace, monospace; -webkit-font-smoothing: none; }
  h1 { font-family: 'Dogica', ui-monospace, monospace; font-weight: normal; font-size: clamp(22px, 5vw, 34px); color: var(--gold); margin: 0; }
  p { margin: 0; max-width: 520px; font-size: 17px; line-height: 1.5; color: var(--dim); }
  button { all: unset; cursor: pointer; font-family: 'Dogica', ui-monospace, monospace; font-size: 18px; color: var(--ink); padding: 14px 18px; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  #got { color: var(--ink); min-height: 1.5em; }
</style>
</head>
<body>
<h1>read the crown</h1>
<p>On the phone: double-tap the crown in Inkling. Here: press read, and hold the phone a hand-span from the camera.</p>
<button id="go" type="button">read</button>
<p id="got" aria-live="polite"></p>
<script>
document.getElementById('go').addEventListener('click', () => INKSHARE.read(code => {
  const link = location.origin + location.pathname.replace(/read(\.html)?$/, '') + '#k=' + code;
  INKSHARE.saveFile(link);
  document.getElementById('got').textContent = 'The kingdom is in. It is handed to the save: a .inkling file (in Downloads, or wherever you choose).';
}));
</script>
</body>
</html>
